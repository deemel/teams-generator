<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams Generator & Games Played Tracker</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6600">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Teams Tracker">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 10px auto;
            padding: 10px;
            background-color: #f4f4f9;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;

            margin-bottom: 15px;
        }
        h2 {
            font-size: 1.3rem;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-icon {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        input[type="text"] {
            padding: 10px;
            width: calc(100% - 100px);
            box-sizing: border-box;
            margin-right: 5px;
            font-size: 16px;
        }
        input[type="number"] {
            padding: 8px;
            width: 60px;
            font-size: 16px;
        }
        select {
            padding: 8px 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: white;
            cursor: pointer;
        }
        button {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e55c00;
        }
        .accept-btn {
            background-color: #28a745;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
            padding: 12px;
        }
        .accept-btn:hover {
            background-color: #218838;
        }
        .accept-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .copy-btn {
            background-color: #17a2b8;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
            padding: 12px;
        }
        .copy-btn:hover {
            background-color: #138496;
        }
        .reset-btn {
            background-color: #dc3545;
            padding: 8px 12px;
            font-size: 14px;
        }
        .reset-btn:hover {
            background-color: #c82333;
        }
        .control-row {
            display: flex;

            padding: 10px;
            background: #eef2f7;

        .player-list-container {

        .player-list {

        .list-header {

            margin-bottom: 8px;
            border-bottom: 2px solid #ccc;

        }
        .header-left-group {

        }
        .header-center-group {

        }
        .header-offset-group {
            display: flex;
            align-items: center;

        }
        .header-right-group {
            display: flex;
            align-items: center;

        .player-item {

            justify-content: space-between;

        }
        .player-left-group {
            display: flex;

        }
        .player-center-group {

            top: 0;
            left: 0;

            height: 100%;

        }
        .custom-alert {
            background-color: #fff3cd;

        }

            background-color: #c82333;

</head>
<body>

    <div class="card">
        <h2><img src="favicon-192.png" alt="" class="header-icon">Teams Generator & Games Played Tracker</h2>

        <!-- Custom Inline Message Banner -->
        <div id="customAlert" class="custom-alert">
            <span id="customAlertMsg"></span>
            <button onclick="hideAlert()">&times;</button>
        </div>

        <!-- Combined Top Control Row -->
        <div class="control-row">
            <div class="control-group">
                <label for="rosterSelect" style="font-weight: bold; color: #333; font-size: 14px;">Roster:</label>
                <select id="rosterSelect" onchange="onRosterSelected()">
                    <option value="empty" selected>Custom (Empty)</option>
                    <option value="monday">Monday</option>
                    <option value="tuesday">Tuesday</option>
                    <option value="thursday">Thursday</option>
                    <option value="thursdayGlenOaks">Thursday Glen Oaks</option>
                    <option value="saturday">Saturday</option>
                    <option value="sunday">Sunday</option>
                    <option value="stelton">Stelton</option>
                </select>
                <span id="todayBadge" class="today-badge">Today</span>
            </div>

            <div class="control-group">
                <label for="playersPerTeamInput" style="font-weight: bold; color: #444; font-size: 14px;">Players/team:</label>
                <input type="number" id="playersPerTeamInput" value="5" min="1" max="15">
            </div>

            <button onclick="resetTracker()" class="reset-btn">Reset</button>
        </div>
        
        <!-- Add Player Form -->
        <div style="margin-bottom: 15px; display: flex; gap: 5px;">
            <input type="text" id="newPlayerName" placeholder="Enter player name..." maxlength="16" style="flex: 1; margin-right: 0;">
            <button onclick="addPlayer()">Add</button>
        </div>

        <div class="player-list-container">
            <span>Available players:</span>
            <span id="playerCountDisplay" style="color: #666; font-size: 14px; font-weight: normal;"><b>Available:</b> 0 / 0</span>
        </div>
        
        <!-- Dynamic Checkboxes Container -->
        <div id="playerContainer" class="player-list"></div>

        <button onclick="generateTeams()" style="width: 100%; margin-top: 10px; padding: 12px;" id="generateBtnText">Generate Teams Preview</button>
    </div>

    <div class="card" id="outputCard" style="display:none;">
        <h2>Teams Preview</h2>
        <div class="teams-container">
            <div class="team">
                <h3>Team 1</h3>
                <ol id="team1List"></ol>
            </div>
            <div class="team">
                <h3>Team 2</h3>
                <ol id="team2List"></ol>
            </div>
        </div>
        <!-- Accept Teams Button -->
        <button id="acceptBtn" class="accept-btn" onclick="acceptLineup()">Accept Teams & Update Games Played</button>

        <!-- Copy Teams Button -->
        <button id="copyTeamsBtn" class="copy-btn" onclick="copyTeamsToClipboard()">Copy Teams as Text</button>
    </div>

    <!-- Games Played History -->
    <div class="card" id="historyCard" style="display:none;">
        <h2>Games Played History</h2>
        <div id="historyContainer"></div>
    </div>

    <script>
        /**
         * Creates a player object with every field at its starting value. The
         * single source of truth for the player shape: rosters, Reset, and
         * addPlayer() all build players here, so a new field only needs adding
         * once. Names are trimmed defensively so stray whitespace can never cause
         * a false-negative duplicate check in addPlayer().
         */
        function createPlayer(name) {
            return {
                name: name.trim(),
                gamesPlayed: 0,
                available: false,
                checkedIn: false,
                checkInTimestamp: null,
                gamesOffset: null,
                gamesAtCheckIn: null,
                availableSince: null
            };
        }

        /**
         * Compares two player names for sorting and duplicate checks. The one
         * place the comparison rule is defined: case-insensitive but
         * accent-sensitive ("alex" equals "Alex", "José" doesn't equal "Jose").
         * A function declaration (not a const arrow) so it's usable by the
         * roster sorts below, which run before this point in the script.
         */
        function compareNames(a, b) {
            return a.localeCompare(b, 'en', { sensitivity: 'accent' });
        }

        /**
         * A player's games offset for fairness math, treating "not checked in"
         * (null) as 0.
         */
        function getOffset(player) {
            return player.gamesOffset ?? 0;
        }

        /**
         * Whether the named player was on either team in the given game.
         */
        function playedIn(game, name) {
            return game.team1.includes(name) || game.team2.includes(name);
        }

        const empty = [];

        const monday = [
            "Ah B", "Alex", "Aric", "Benny", "Billy", "Brian", "Chris", "Danny", "Deric", "Eric",
            "Fai", "Francis", "Howard", "Jeffrey", "Joe", "Kelvin", "Kenji", "Kenneth", "Kit", "Kobe",
            "Kyth", "Lok", "Pat", "Raymond", "Ricky", "Sunny", "Timmy", "Travis", "Wayne", "奶仔", "蔡哥"
        ];

        const tuesday = [
            "Adrian", "Alex", "Alex friend 1", "Andy", "Angel", "Angel Jr", "Danny", "Derek", "Eric", "Eric Jr",
            "Francis", "Jack", "James", "Jason", "JD", "JD friend 1", "JD friend 2", "JD friend 3", "Kevin", "Lam",
            "Mailman", "Randy", "Ray T", "Wing"
        ];

        const thursday = [
            "Benny", "Bing", "Dan Lau", "Danny", "George", "Giles", "Jack", "James", "Jay", "Kenny",
            "Kok Kit Lee", "Kwok", "Michael Leung", "Michael Poon", "Nelson", "Paul", "Peter", "Phil", "Steve", "Tony",
            "Wai Yip Lee", "William", "二少", "建哥", "梁光远", "韓家聲"
        ];

        const thursdayGlenOaks = [
            "Alex", "Amenophis", "Andrew", "Benghor", "Buddy", "Danny", "David", "Demz", "Devon", "Flippa",
            "Francis", "Fred", "H", "Hing", "Indio", "James", "James Lin", "Jay", "Jimmy", "Joe",
            "JT", "Justin", "Kevin", "KevinBookher", "Kyth", "Li", "Todd", "Tony"
        ];

        const saturday = [
            "Adrian", "Alex", "Amenophis", "Andrew Ng", "Andrew Yu", "Benghor", "Brian", "Buddy", "Corey", "Danny",
            "David", "David Jang", "Demz", "Devon", "Eddie", "Eliezer", "Eric", "Flippa", "Francis", "Fred",
            "G", "Gyu", "H", "Hing", "Indio", "Jabe", "James", "James Lin", "Jason", "Jay",
            "Jim Turvey", "Jimmy", "Joe", "John", "John Kim", "Jon", "Josh", "JT", "Justin", "Kevin",
            "KevinBookher", "Kyth", "Li", "Otari", "Paul", "Rashan", "Ray", "Ricky", "RJ", "Steve",
            "Tasso", "Timothy", "Todd", "Tony"
        ];

        const sunday = [
            "Adrian", "Alex", "Andy", "Angel", "Angel Jr", "Bill", "Daniel", "Danny", "Dofu", "Don",
            "Dong", "Edwin", "Eugene", "Jack", "James", "Jay", "John", "Kasing", "Kent", "Kyo",
            "Mark", "Matthew", "Mike", "Ray", "Randy", "Sit Wong", "Waiho", "Wing", "Yili", "Zai Zai", "梁光远"
        ].sort(compareNames);

        const stelton = [
            "Adi", "Ben", "Brent", "Chad", "Dan", "Danny", "Devin", "Ed", "Giles", "Houdine",
            "Joe", "Joel", "Joey", "Jose", "Keith", "Malik", "Marshall", "Matt", "Mike", "Mike Jr",
            "Pat Lawrence", "Pat Liang", "Phil", "Rafi", "Scott", "Steve Braunstein", "Steve Vlaun", "Troy", "Valeriy"
        ];

        /**
         * Maps a roster select-option value to its list of player names.
         * Falls back to the empty roster for unknown keys.
         */
        function getRosterByKey(key) {
            const rosterMap = {
                empty: empty,
                monday: monday,
                tuesday: tuesday,
                thursday: thursday,
                thursdayGlenOaks: thursdayGlenOaks,
                saturday: saturday,
                sunday: sunday,
                stelton: stelton
            };
            return rosterMap[key] || empty;
        }

        // Index i = Date.getDay() result (0 = Sunday ... 6 = Saturday). null marks
        // days with no associated roster (Wednesday, Friday), so startup falls
        // back to the empty Custom roster.
        // Thursday has two rosters (thursday, thursdayGlenOaks) — 'thursday' is the default.
        const ROSTER_KEY_BY_DAY_OF_WEEK = [
            'sunday', 'monday', 'tuesday', null, 'thursday', null, 'saturday'
        ];

        /**
         * Maps today's day of the week to a roster key, so the app can default
         * to "today's roster" on load. Returns null for days with no
         * associated roster, so startup falls back to the empty Custom roster.
         */
        function getDefaultRosterKeyForToday() {
            return ROSTER_KEY_BY_DAY_OF_WEEK[new Date().getDay()] || null;
        }

        // The app keeps nothing between loads. Older versions saved session state
        // and the last-used roster under keys with this prefix;
        // clearLegacySavedState() removes any left behind.
        const LEGACY_STORAGE_KEY_PREFIX = 'teams_tracker_';

        /**
         * Removes state saved by older versions of the app. Keys are collected
         * first, since removing items while iterating localStorage by index
         * would shift the remaining indices.
         */
        function clearLegacySavedState() {
            const legacyKeys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(LEGACY_STORAGE_KEY_PREFIX)) {
                    legacyKeys.push(key);
                }
            }
            legacyKeys.forEach(key => localStorage.removeItem(key));
        }

        let players = [];
        // Previewed teams are stored by player NAME, not by index into the
        // players array. Indices go stale whenever that array is re-sorted
        // (e.g. addPlayer()) between Generate and Accept/Copy; names are
        // unique per roster and never change, so they stay valid.
        let pendingTeam1Names = [];
        let pendingTeam2Names = [];
        let gamesHistory = [];

        // Bundled together since they're one piece of state ("how the player
        // list is currently sorted") rather than two independent values.
        let playerSort = { column: 'name', direction: 'asc' };

        /**
         * Effective Games Played: a player's raw gamesPlayed plus their gamesOffset
         * (the average effective games they were credited with at check-in). Used as
         * the fairness basis for both the check-in average calculation and team generation.
         */
        function getEffectiveGamesPlayed(player) {
            return player.gamesPlayed + getOffset(player);
        }

        /**
         * Returns the average of `values`, rounded to the nearest integer, or 0
         * for an empty list. Shared by computeCurrentAvgOffset() and
         * updateGamesOffsetsAfterDeletion() so the check-in offset and its
         * post-deletion correction always round the same way.
         *
         * Rounded rather than floored: flooring always rounded in the newcomer's
         * favor (an average of 2.9 credited them with only 2), giving late
         * check-ins a slight but consistent priority edge.
         */
        function roundedAverage(values) {
            return values.length > 0
                ? Math.round(values.reduce((sum, v) => sum + v, 0) / values.length)
                : 0;
        }

        /**
         * Returns the average effective games played (gamesPlayed + gamesOffset)
         * among all currently checked-in players, rounded to the nearest integer
         * (see roundedAverage()). Used as the games-offset value assigned to a
         * player at the moment they check in, so a newcomer is credited with
         * roughly what everyone else has played. Returns 0 if no one is checked
         * in yet.
         */
        function computeCurrentAvgOffset() {
            return roundedAverage(players.filter(p => p.checkedIn).map(getEffectiveGamesPlayed));
        }

        /**
         * Records a check-in on a player object: offset snapshot, check-in time,
         * and how many games were already in history at that moment. Shared by
         * toggleCheckedIn() and both select-all handlers so all three always
         * record the same fields.
         */
        function applyCheckIn(player) {
            // Computed before setting checkedIn, so the player doesn't count
            // themselves in the average.
            player.gamesOffset = computeCurrentAvgOffset();
            player.checkedIn = true;
            player.checkInTimestamp = Date.now();
            player.gamesAtCheckIn = gamesHistory.length;
        }

        /**
         * Clears all check-in fields on a player object. Shared by
         * toggleCheckedIn() and toggleAllCheckedIn().
         */
        function applyCheckOut(player) {
            player.checkedIn = false;
            markUnavailable(player);
            player.checkInTimestamp = null;
            player.gamesOffset = null;
            player.gamesAtCheckIn = null;
        }

        /**
         * Marks a player available and records where in history their current
         * availability began. getStreakScore() only counts games from that point,
         * so games a player missed while absent or resting don't count as sitting
         * out. Only recorded on a real unavailable→available change, so re-marking
         * an already-available player doesn't reset their streak.
         */
        function markAvailable(player) {
            if (!player.available) {
                player.available = true;
                player.availableSince = gamesHistory.length;
            }
        }

        /**
         * Marks a player unavailable and clears their availability start point.
         */
        function markUnavailable(player) {
            player.available = false;
            player.availableSince = null;
        }

        /**
         * A player's effective games played as of the moment the first
         * `historyCount` games had been recorded. Works backward from their
         * current gamesPlayed by subtracting the games they appear in after
         * that point, so manual +/- adjustments made earlier are preserved.
         */
        function getEffectiveGamesPlayedAt(player, historyCount) {
            const gamesSince = gamesHistory.slice(historyCount).filter(game => playedIn(game, player.name)).length;
            const gamesThen = Math.max(0, player.gamesPlayed - gamesSince);
            return gamesThen + getOffset(player);
        }

        /**
         * Corrects checked-in players' gamesOffset after the game at
         * `deletedIndex` has been removed from gamesHistory (and gamesPlayed
         * counts decremented). Must be called AFTER the splice.
         *
         * An offset reflects what everyone else had played at the moment a
         * player checked in, so:
         * - If the deleted game came AFTER a player's check-in, their offset is
         *   unchanged — it couldn't have affected it.
         * - If it came BEFORE, their gamesAtCheckIn shifts down by one (to keep
         *   pointing at the same spot in history) and their offset is recomputed
         *   from what the earlier-checked-in players had played at that point —
         *   NOT from their current totals, which include later games.
         *
         * Players are processed in check-in order so any earlier player whose
         * offset changes is already corrected before later players use it.
         */
        function updateGamesOffsetsAfterDeletion(deletedIndex) {
            const checkedInIndices = players
                .map((p, idx) => idx)
                .filter(idx => players[idx].checkedIn)
                .sort((a, b) => (players[a].checkInTimestamp - players[b].checkInTimestamp) || (a - b));

            const earlier = [];
            checkedInIndices.forEach(idx => {
                const player = players[idx];
                if (deletedIndex < player.gamesAtCheckIn) {
                    player.gamesAtCheckIn--;
                    const k = player.gamesAtCheckIn;
                    player.gamesOffset = roundedAverage(earlier.map(pl => getEffectiveGamesPlayedAt(pl, k)));
                }
                earlier.push(player);
            });
        }

        /**
         * Formats a checkInTimestamp (ms since epoch, from Date.now()) into a
         * short display string like "03:45 PM" for showing next to a player's
         * Checked In checkbox. Returns an empty string if no timestamp is set.
         */
        function formatCheckInTime(timestamp) {
            if (!timestamp) return '';
            return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        /**
         * Escapes HTML-significant characters in a string before it's interpolated
         * into an innerHTML template. Needed because player names and other
         * user-entered text are set via innerHTML template strings (not textContent,
         * which auto-escapes), so this prevents that content from being interpreted
         * as markup.
         */
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /**
         * Joins names into readable English: "A", "A and B", "A, B, and C".
         * Used for user-facing messages that list players.
         */
        function formatNameList(names) {
            if (names.length <= 1) return names.join('');
            if (names.length === 2) return `${names[0]} and ${names[1]}`;
            return `${names.slice(0, -1).join(', ')}, and ${names[names.length - 1]}`;
        }

        /**
         * Converts a checkInTimestamp into minutes since midnight (local time),
         * matching the same hh:mm granularity shown in the UI via
         * formatCheckInTime(). Used for sorting so two check-ins that display
         * the same hh:mm AM/PM time are correctly treated as ties, rather than
         * being ordered by their exact (invisible) millisecond difference.
         * Returns null if no timestamp is set.
         */
        function getCheckInMinutes(timestamp) {
            if (!timestamp) return null;
            let d = new Date(timestamp);
            return d.getHours() * 60 + d.getMinutes();
        }

        function setSortColumn(column) {
            if (playerSort.column === column) {
                playerSort.direction = (playerSort.direction === 'asc') ? 'desc' : 'asc';
            } else {
                playerSort.column = column;
                // Sensible default per column: names read naturally A-Z,
                // everything else (checkboxes/numbers) reads naturally highest/most-recent-first
                playerSort.direction = (column === 'name') ? 'asc' : 'desc';
            }
            renderPlayerList();
        }

        function getSortedPlayerIndices() {
            let indices = players.map((_, idx) => idx);

            if (playerSort.column === 'name') {
                indices.sort((a, b) => compareNames(players[a].name, players[b].name));
            } else if (playerSort.column === 'checkedIn') {
                indices.sort((a, b) => {
                    let minutesA = getCheckInMinutes(players[a].checkInTimestamp);
                    let minutesB = getCheckInMinutes(players[b].checkInTimestamp);
                    if (minutesA === null) minutesA = -1;
                    if (minutesB === null) minutesB = -1;
                    if (minutesA !== minutesB) {
                        return minutesA - minutesB;
                    }
                    // Name tiebreaker always reads A→Z regardless of column
                    // sort direction. Since the whole array gets reversed below when
                    // playerSort.direction is 'desc', negate the comparison here so it
                    // lands back in A→Z order after that reversal.
                    let nameCompare = compareNames(players[a].name, players[b].name);
                    return playerSort.direction === 'desc' ? -nameCompare : nameCompare;
                });
            } else if (playerSort.column === 'gamesOffset') {
                indices.sort((a, b) => {
                    let offsetA = players[a].gamesOffset ?? -1;
                    let offsetB = players[b].gamesOffset ?? -1;
                    if (offsetA !== offsetB) {
                        return offsetA - offsetB;
                    }
                    // Name tiebreaker always reads A→Z regardless of column
                    // sort direction — see the same pattern in the checkedIn branch above.
                    let nameCompare = compareNames(players[a].name, players[b].name);
                    return playerSort.direction === 'desc' ? -nameCompare : nameCompare;
                });
            } else if (playerSort.column === 'gamesPlayed') {
                indices.sort((a, b) => {
                    if (players[a].gamesPlayed !== players[b].gamesPlayed) {
                        return players[a].gamesPlayed - players[b].gamesPlayed;
                    }
                    // Name tiebreaker always reads A→Z regardless of column
                    // sort direction — see the same pattern in the checkedIn and
                    // gamesOffset branches above.
                    let nameCompare = compareNames(players[a].name, players[b].name);
                    return playerSort.direction === 'desc' ? -nameCompare : nameCompare;
                });
            }

            if (playerSort.direction === 'desc') {
                indices.reverse();
            }

            return indices;
        }

        /**
         * Returns the HTML for a clickable, sortable column header label,
         * including the ▲/▼ arrow when this column is the active sort column.
         */
        function sortableHeaderHTML(text, columnKey) {
            let arrow = '';
            if (playerSort.column === columnKey) {
                arrow = playerSort.direction === 'asc' ? ' \u25B2' : ' \u25BC';
            }
            return `<span class="sortable-header" onclick="setSortColumn('${columnKey}')">${escapeHtml(text)}${arrow}</span>`;
        }

        /**
         * Shows/hides the "Today" badge next to the roster dropdown, based on
         * whether the currently selected roster matches today's day-of-week
         * default (see getDefaultRosterKeyForToday()). Called whenever the
         * selected roster changes, so the badge only ever appears next to the
         * roster that was actually auto-selected for today.
         */
        function updateTodayBadge() {
            const badge = document.getElementById('todayBadge');
            const selectedRoster = document.getElementById('rosterSelect').value;
            const todayRosterKey = getDefaultRosterKeyForToday();
            badge.style.display = (todayRosterKey && selectedRoster === todayRosterKey) ? 'inline' : 'none';
        }

        /**
         * Starts a fresh session with the roster currently chosen in the
         * dropdown. Used both when the user picks a roster and on app startup,
         * so the two always behave identically.
         */
        function onRosterSelected() {
            updateTodayBadge();
            resetTracker();
        }

        function showAlert(message) {
            const alertBox = document.getElementById('customAlert');
            const alertMsg = document.getElementById('customAlertMsg');
            alertMsg.textContent = message;
            alertBox.style.display = 'flex';
        }

        function hideAlert() {
            document.getElementById('customAlert').style.display = 'none';
        }

        function updatePlayerCounts() {
            let total = players.length;
            let availableCount = players.filter(p => p.available).length;
            document.getElementById('playerCountDisplay').innerHTML = `<b>Available:</b> ${availableCount} / ${total}`;
        }

        function toggleSelectAllAvailable(isChecked) {
            if (isChecked) {
                players.forEach((p) => {
                    if (!p.checkedIn) {
                        // Same as toggleCheckedIn(): the offset is based on everyone
                        // already checked in so far, including earlier ones in this loop.
                        applyCheckIn(p);
                    }
                    markAvailable(p);
                });
            } else {
                players.forEach(markUnavailable);
            }

            renderPlayerList();
        }

        function toggleAllCheckedIn(isChecked) {
            if (isChecked) {
                players.forEach((p) => {
                    if (!p.checkedIn) {
                        // Same as toggleCheckedIn()/toggleSelectAllAvailable(): the
                        // offset is based on everyone already checked in so far,
                        // including earlier ones in this loop.
                        applyCheckIn(p);
                    }
                    markAvailable(p);
                });
            } else {
                players.forEach(applyCheckOut);
            }

            renderPlayerList();
        }

        /**
         * Renders the player list: a sortable header row plus one row per
         * player. Builds the whole thing as an HTML string via template
         * literals and sets it in a single innerHTML assignment, rather than
         * constructing each element/attribute individually with
         * document.createElement — same visual result, far less code.
         */
        function renderPlayerList() {
            const container = document.getElementById('playerContainer');

            // Preserve current scroll position before rebuilding
            const existingRows = container.querySelector('.player-rows');
            const previousScrollTop = existingRows ? existingRows.scrollTop : 0;

            let totalCount = players.length;
            let availableCount = players.filter(p => p.available).length;
            let checkedInCount = players.filter(p => p.checkedIn).length;

            let sortedIndices = getSortedPlayerIndices();

            let rowsHtml = sortedIndices.map((index) => {
                let p = players[index];
                let nameColor = p.available ? '#000' : '#888';
                let checkInTimeHtml = (p.checkedIn && p.checkInTimestamp)
                    ? `<span class="checkin-time">${escapeHtml(formatCheckInTime(p.checkInTimestamp))}</span>`
                    : '';
                let offsetText = p.gamesOffset ?? '-';

                return `
                    <div class="player-item">
                        <div class="player-left-group">
                            <div class="player-info">
                                <input type="checkbox" id="available_${index}" ${p.available ? 'checked' : ''}
                                    onchange="toggleAvailable(${index}, this.checked)">
                                <label for="available_${index}" class="player-name-label" style="cursor: pointer; color: ${nameColor};" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</label>
                            </div>
                        </div>
                        <div class="player-center-group">
                            <input type="checkbox" id="checkedIn_${index}" ${p.checkedIn ? 'checked' : ''}
                                onchange="toggleCheckedIn(${index}, this.checked)">
                            ${checkInTimeHtml}
                        </div>
                        <div class="player-offset-group">
                            <span class="stats-badge">${offsetText}</span>
                        </div>
                        <div class="player-right-group">
                            <div class="counter-controls" style="display: flex; align-items: center; gap: 8px;">
                                <button class="counter-btn" onclick="adjustGames(${index}, -1)">-</button>
                                <span class="stats-badge">${p.gamesPlayed}</span>
                                <button class="counter-btn" onclick="adjustGames(${index}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="list-header">
                    <div class="header-left-group">
                        <input type="checkbox" id="selectAllCheckbox" ${(totalCount > 0 && availableCount === totalCount) ? 'checked' : ''}
                            onchange="toggleSelectAllAvailable(this.checked)">
                        ${sortableHeaderHTML("Player Name", 'name')}
                    </div>
                    <div class="header-center-group">
                        <input type="checkbox" id="selectAllCheckedInCheckbox" ${(totalCount > 0 && checkedInCount === totalCount) ? 'checked' : ''}
                            onchange="toggleAllCheckedIn(this.checked)">
                        ${sortableHeaderHTML("Checked In", 'checkedIn')}
                    </div>
                    <div class="header-offset-group">
                        ${sortableHeaderHTML("Games Offset", 'gamesOffset')}
                    </div>
                    <div class="header-right-group">
                        ${sortableHeaderHTML("Games Played", 'gamesPlayed')}
                    </div>
                </div>
                <div class="player-rows">${rowsHtml}</div>
            `;

            // "indeterminate" can't be expressed via an HTML attribute, so it's
            // set imperatively here right after the markup is inserted.
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (selectAllCheckbox) {
                selectAllCheckbox.indeterminate = availableCount > 0 && availableCount < totalCount;
            }
            const selectAllCheckedInCheckbox = document.getElementById('selectAllCheckedInCheckbox');
            if (selectAllCheckedInCheckbox) {
                selectAllCheckedInCheckbox.indeterminate = checkedInCount > 0 && checkedInCount < totalCount;
            }

            // Restore scroll position after rebuilding the list
            const rowsContainer = container.querySelector('.player-rows');
            if (rowsContainer) {
                rowsContainer.scrollTop = previousScrollTop;
            }

            updatePlayerCounts();
        }

        function addPlayer() {
            const input = document.getElementById('newPlayerName');
            const name = input.value.trim();
            if (name === "") {
                return;
            }
            if (name.length > 16) {
                showAlert("Player name must be 16 characters or fewer.");
                return;
            }
            // "name" is trimmed above and every player's name is trimmed in
            // createPlayer(), so stray whitespace can't fool this check.
            const isDuplicate = players.some(p => compareNames(p.name, name) === 0);
            if (isDuplicate) {
                showAlert(`"${name}" is already on this roster.`);
                return;
            }
            players.push(createPlayer(name));
            players.sort((a, b) => compareNames(a.name, b.name));
            input.value = '';
            hideAlert();
            renderPlayerList();
        }

        function toggleAvailable(index, isAvailable) {
            const player = players[index];

            // If marking available and they aren't checked in yet, auto check them in
            if (isAvailable && !player.checkedIn) {
                toggleCheckedIn(index, true);
                return; // toggleCheckedIn() already re-renders
            }

            if (isAvailable) {
                markAvailable(player);
            } else {
                markUnavailable(player);
            }

            renderPlayerList();
        }

        function toggleCheckedIn(index, isCheckedIn) {
            if (isCheckedIn) {
                // Records the offset snapshot (a fairness input during team
                // generation) and the history position used to correct it later.
                applyCheckIn(players[index]);
                markAvailable(players[index]);
            } else {
                applyCheckOut(players[index]);
            }

            renderPlayerList();
        }

        function adjustGames(index, amount) {
            players[index].gamesPlayed += amount;
            if (players[index].gamesPlayed < 0) {
                players[index].gamesPlayed = 0;
            }
            renderPlayerList();
        }

        /**
         * Starts a fresh session for the currently selected roster: rebuilds
         * its players from the roster's name list and clears all check-ins,
         * games played, and history. Runs when the user clicks Reset, and
         * whenever a roster is selected (from the dropdown or on app startup —
         * see onRosterSelected()).
         */
        function resetTracker() {
            const currentRoster = document.getElementById('rosterSelect').value;

            players = getRosterByKey(currentRoster).map(name => createPlayer(name));
            pendingTeam1Names = [];
            pendingTeam2Names = [];
            gamesHistory = [];
            document.getElementById('playersPerTeamInput').value = 5;
            document.getElementById('newPlayerName').value = '';
            document.getElementById('outputCard').style.display = 'none';
            hideAlert();
            renderPlayerList();
            renderHistory();

            const rowsContainer = document.querySelector('#playerContainer .player-rows');
            if (rowsContainer) {
                rowsContainer.scrollTop = 0;
            }
        }

        /**
         * Shuffles an array in place using the Fisher–Yates algorithm and
         * returns it. Every possible ordering is exactly equally likely.
         *
         * Used instead of the common sort(() => Math.random() - 0.5) trick,
         * which is biased: sort() assumes a consistent comparator, so random
         * answers make elements tend to stay near their starting positions
         * (and the exact bias varies by browser). Since the arrays shuffled
         * here start in alphabetical or priority order, that bias would leak
         * into who wins tie-breaks and who ends up on which team.
         */
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // ---- Teammate-repeat avoidance --------------------------------------

        // A new team may not contain this many (or more) players who were all on
        // the same team together in an earlier game this session.
        const REPEAT_GROUP_SIZE = 3;

        // Maximum random splits to try before settling for the least-overlap one.
        const SPLIT_ATTEMPTS = 2000;

        /**
         * Returns every team from this session's games as a Set of player
         * names, for fast membership checks.
         */
        function getPastTeams() {
            const teams = [];
            gamesHistory.forEach(game => {
                teams.push(new Set(game.team1));
                teams.push(new Set(game.team2));
            });
            return teams;
        }

        /**
         * Scores how badly a proposed team repeats past teammate groups.
         * For each past team, counts how many of this team's players were on
         * it; any overlap at or above REPEAT_GROUP_SIZE adds to the penalty
         * (larger overlaps cost more). 0 means no rule violations.
         */
        function getRepeatPenalty(teamNames, pastTeams) {
            let penalty = 0;
            pastTeams.forEach(pastTeam => {
                let overlap = 0;
                teamNames.forEach(name => {
                    if (pastTeam.has(name)) overlap++;
                });
                if (overlap >= REPEAT_GROUP_SIZE) {
                    penalty += overlap - (REPEAT_GROUP_SIZE - 1);
                }
            });
            return penalty;
        }

        /**
         * Splits the chosen players into two teams of `perTeam`, avoiding any
         * team that repeats a teammate group of REPEAT_GROUP_SIZE or more from
         * an earlier game this session.
         *
         * Tries uniformly random splits and returns the first one with no
         * violations — so every valid split is equally likely. If none is
         * found within SPLIT_ATTEMPTS, returns the split with the lowest
         * penalty. Returns { team1, team2, penalty }.
         */
        function findBestSplit(names, perTeam) {
            const pastTeams = getPastTeams();
            const work = [...names];
            let best = null;

            for (let attempt = 0; attempt < SPLIT_ATTEMPTS; attempt++) {
                shuffle(work);
                const team1 = work.slice(0, perTeam);
                const team2 = work.slice(perTeam, perTeam * 2);
                const penalty = getRepeatPenalty(team1, pastTeams) + getRepeatPenalty(team2, pastTeams);

                if (best === null || penalty < best.penalty) {
                    best = { team1: [...team1], team2: [...team2], penalty: penalty };
                    if (penalty === 0) break;
                }
            }

            return best;
        }

        function generateTeams() {
            hideAlert();
    
            // 1. Read input configuration
            let perTeamInput = parseInt(document.getElementById('playersPerTeamInput').value);
            if (isNaN(perTeamInput) || perTeamInput < 1) {
                showAlert("Please enter a valid number of players per team!");
                return;
            }

            // 2. Filter for available players
            let selectedIndices = [];
            players.forEach((p, index) => {
                if (p.available) {
                    selectedIndices.push(index);
                }
            });

            let requiredTotal = perTeamInput * 2;
            if (selectedIndices.length < requiredTotal) {
                showAlert(`Please select at least ${requiredTotal} available players to form two ${perTeamInput}-player teams!`);
                return;
            }

            /**
             * Streak Score Helper. Counts only games played since this player
             * last became available (see markAvailable()), so latecomers and players
             * returning from a rest start at 0 instead of being credited with sit-outs
             * for games they weren't there for.
             * - Returns a NEGATIVE number for consecutive games SAT OUT (e.g., -2 = sat out 2 straight games).
             * - Returns a POSITIVE number for consecutive games PLAYED (e.g., +2 = played 2 straight games).
             * - Returns 0 if no games have been played since they became available.
             */
            function getStreakScore(playerIndex) {
                const player = players[playerIndex];
                const relevantGames = gamesHistory.slice(player.availableSince);
                if (relevantGames.length === 0) return 0;

                // Check last game played state
                const playedLast = playedIn(relevantGames[relevantGames.length - 1], player.name);

                let streak = 0;
                for (let i = relevantGames.length - 1; i >= 0; i--) {
                    if (playedIn(relevantGames[i], player.name) === playedLast) {
                        streak++;
                    } else {
                        break;
                    }
                }

                return playedLast ? streak : -streak;
            }

            // 3. Group players by their exact streak score
            let groupedMap = {};
            selectedIndices.forEach(i => {
                let score = getStreakScore(i);
                if (!groupedMap[score]) groupedMap[score] = [];
                groupedMap[score].push(i);
            });

            // 4. Sort groups ascending (most negative scores first = highest priority)
            let prioritizedIndices = [];
            Object.keys(groupedMap)
                .map(Number)
                .sort((a, b) => a - b)
                .forEach(score => {
                    let group = groupedMap[score];

                    // Pre-shuffle so any exact ties in effective games played land
                    // in a genuinely random order (see shuffle() for why this isn't
                    // done with sort())
                    shuffle(group);

                    // Within each streak tier, prioritize players with fewer effective games played
                    // (gamesPlayed + gamesOffset) — sort() is stable, so the random pre-shuffle
                    // above still governs exact ties
                    group.sort((a, b) => getEffectiveGamesPlayed(players[a]) - getEffectiveGamesPlayed(players[b]));

                    prioritizedIndices.push(...group);
                });

            // 5. Select the top required players (fairness decides WHO plays)...
            let totalNeeded = perTeamInput * 2;
            let chosenNames = prioritizedIndices.slice(0, totalNeeded).map(i => players[i].name);

            // ...then split them into teams, avoiding repeat teammate groups
            // from earlier this session (see findBestSplit()). Names, not
            // indices, are stored — indices go stale if the players array is
            // re-sorted before Accept/Copy.
            const split = findBestSplit(chosenNames, perTeamInput);

            // Sorted alphabetically for visual presentation.
            pendingTeam1Names = split.team1.sort(compareNames);
            pendingTeam2Names = split.team2.sort(compareNames);

            // 6. Update UI
            const team1List = document.getElementById('team1List');
            const team2List = document.getElementById('team2List');
    
            team1List.innerHTML = '';
            team2List.innerHTML = '';

            pendingTeam1Names.forEach(name => {
                let li = document.createElement('li');
                li.textContent = name;
                team1List.appendChild(li);
            });

            pendingTeam2Names.forEach(name => {
                let li = document.createElement('li');
                li.textContent = name;
                team2List.appendChild(li);
            });

            const acceptBtn = document.getElementById('acceptBtn');
            acceptBtn.disabled = false;
            acceptBtn.textContent = "Accept Teams & Update Games Played";

            document.getElementById('outputCard').style.display = 'block';

            if (split.penalty > 0) {
                showAlert(`Couldn't fully avoid repeating a group of ${REPEAT_GROUP_SIZE}+ teammates from earlier this session with these players, so the split with the least overlap was used.`);
            }
        }

        function copyTeamsToClipboard() {
            if (pendingTeam1Names.length === 0 && pendingTeam2Names.length === 0) {
                showAlert("Generate teams first before copying.");
                return;
            }

            let lines = [];
            lines.push("Team 1:");
            pendingTeam1Names.forEach((name, idx) => {
                lines.push(`${idx + 1}. ${name}`);
            });
            lines.push("");
            lines.push("Team 2:");
            pendingTeam2Names.forEach((name, idx) => {
                lines.push(`${idx + 1}. ${name}`);
            });

            let teamsText = lines.join("\n");

            const copyBtn = document.getElementById('copyTeamsBtn');
            const originalText = copyBtn ? copyBtn.textContent : null;

            function showCopiedFeedback() {
                if (copyBtn) {
                    copyBtn.textContent = "Copied!";
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                    }, 1500);
                }
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(teamsText).then(showCopiedFeedback).catch(() => {
                    fallbackCopyText(teamsText, showCopiedFeedback);
                });
            } else {
                fallbackCopyText(teamsText, showCopiedFeedback);
            }
        }

        function fallbackCopyText(text, onSuccess) {
            let textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                if (onSuccess) onSuccess();
            } catch (e) {
                showAlert("Unable to copy teams. Please copy manually.");
            }
            document.body.removeChild(textarea);
        }

        function acceptLineup() {
            const previewNames = [...pendingTeam1Names, ...pendingTeam2Names];

            // Refuse to record a lineup that's gone stale: if anyone in the
            // preview has been marked unavailable (or no longer exists) since
            // Generate, the preview no longer reflects who's actually playing.
            // Recording it anyway would put players in history who weren't
            // credited, corrupting streaks, deletions, and offset corrections.
            const unavailableNames = previewNames.filter(name => {
                const player = players.find(p => p.name === name);
                return !player || !player.available;
            });
            if (unavailableNames.length > 0) {
                const verb = unavailableNames.length === 1 ? 'is' : 'are';
                showAlert(`${formatNameList(unavailableNames)} ${verb} no longer available. Generate again to update teams.`);
                return;
            }

            // Everyone in the lineup is confirmed available, so every name
            // recorded in history below is also credited here — the two
            // always stay in sync.
            const selectedNames = new Set(previewNames);
            players.forEach(p => {
                if (selectedNames.has(p.name)) {
                    p.gamesPlayed++;
                }
            });
            hideAlert();
            renderPlayerList();

            // Add to games history. `timestamp` is a display string only, and
            // history is never sorted by time — see getSortedHistoryIndices()
            // for why.
            gamesHistory.push({
                team1: [...pendingTeam1Names],
                team2: [...pendingTeam2Names],
                timestamp: new Date().toLocaleString()
            });
            renderHistory();

            const acceptBtn = document.getElementById('acceptBtn');
            acceptBtn.disabled = true;
            acceptBtn.textContent = "Accept Teams & Update Games Played";
        }

        function deleteGame(historyIndex) {
            let game = gamesHistory[historyIndex];

            // Decrement games played count for players who were in this game entry
            let allPlayerNames = [...game.team1, ...game.team2];
            allPlayerNames.forEach(name => {
                let player = players.find(p => p.name === name);
                if (player && player.gamesPlayed > 0) {
                    player.gamesPlayed--;
                }
            });

            // Remove game entry from history
            gamesHistory.splice(historyIndex, 1);

            // Keep each availableSince pointing at the same spot in history. A deleted
            // game before that point shifts it down by one; a game after it doesn't affect it.
            players.forEach(p => {
                if (p.availableSince !== null && historyIndex < p.availableSince) {
                    p.availableSince--;
                }
            });

            // Any open preview was generated from the old history (streaks and
            // games played), so it no longer reflects who should be playing.
            // Clear it so Accept can't record a stale lineup. Only notify the
            // user if the preview was still pending — an already-accepted
            // preview has nothing left to lose.
            const outputCard = document.getElementById('outputCard');
            const acceptBtn = document.getElementById('acceptBtn');
            const previewWasPending = outputCard.style.display !== 'none' && !acceptBtn.disabled;
            pendingTeam1Names = [];
            pendingTeam2Names = [];
            outputCard.style.display = 'none';

            updateGamesOffsetsAfterDeletion(historyIndex);
            renderPlayerList();
            renderHistory();

            if (previewWasPending) {
                showAlert("Teams preview cleared because game history changed. Generate again for updated teams.");
            }
        }

        /**
         * Returns gamesHistory indices in newest-first order. Games are always
         * appended via push() in acceptLineup(), so array position already IS
         * the true chronological order — reversing it is sufficient.
         *
         * This intentionally does NOT sort by any wall-clock timestamp
         * (e.g. Date.now()). System clocks are not guaranteed to move only
         * forward — NTP sync, DST transitions, or a manual/automatic clock
         * adjustment can make it jump backward — which would give a later
         * game a smaller timestamp than an earlier one and put them in the
         * wrong order. Array position has no such failure mode.
         */
        function getSortedHistoryIndices() {
            return gamesHistory.map((_, idx) => idx).reverse();
        }

        /**
         * Renders the Games Played History card: one entry per game, newest
         * first. Builds the whole thing as an HTML string via template
         * literals and sets it in a single innerHTML assignment, rather than
         * constructing each element with document.createElement.
         */
        function renderHistory() {
            const historyContainer = document.getElementById('historyContainer');
            const historyCard = document.getElementById('historyCard');

            if (gamesHistory.length === 0) {
                historyContainer.innerHTML = '';
                historyCard.style.display = 'none';
                return;
            }

            historyCard.style.display = 'block';

            historyContainer.innerHTML = getSortedHistoryIndices().map((index) => {
                let game = gamesHistory[index];
                let team1Html = game.team1.map(name => `<li>${escapeHtml(name)}</li>`).join('');
                let team2Html = game.team2.map(name => `<li>${escapeHtml(name)}</li>`).join('');

                return `
                    <div class="history-item">
                        <div class="history-item-header">
                            <h4>Game ${index + 1}</h4>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span class="history-timestamp">${escapeHtml(game.timestamp)}</span>
                                <button class="delete-btn" onclick="deleteGame(${index})">Delete</button>
                            </div>
                        </div>
                        <div class="teams-container">
                            <div class="team">
                                <h3>Team 1</h3>
                                <ol>${team1Html}</ol>
                            </div>
                            <div class="team">
                                <h3>Team 2</h3>
                                <ol>${team2Html}</ol>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Initialize on page load: clear any state older versions saved, then
        // start fresh with today's roster, or the empty Custom roster on days
        // without one. onRosterSelected() does exactly what happens when a
        // roster is picked from the dropdown.
        clearLegacySavedState();
        document.getElementById('rosterSelect').value = getDefaultRosterKeyForToday() || 'empty';
        onRosterSelected();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
