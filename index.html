<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams Generator & Games Played Tracker</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6600">
    <link rel="apple-touch-icon" href="favicon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Teams Tracker">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 10px auto;
            padding: 10px;
            background-color: #f4f4f9;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        h2 {
            font-size: 1.3rem;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-icon {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        input[type="text"] {
            padding: 10px;
            width: calc(100% - 100px);
            box-sizing: border-box;
            margin-right: 5px;
            font-size: 16px;
        }
        input[type="number"] {
            padding: 8px;
            width: 60px;
            font-size: 16px;
        }
        select {
            padding: 8px 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: white;
            cursor: pointer;
        }
        button {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e55c00;
        }
        .accept-btn {
            background-color: #28a745;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
            padding: 12px;
        }
        .accept-btn:hover {
            background-color: #218838;
        }
        .accept-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .copy-btn {
            background-color: #17a2b8;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
            padding: 12px;
        }
        .copy-btn:hover {
            background-color: #138496;
        }
        .reset-btn {
            background-color: #dc3545;
            padding: 8px 12px;
            font-size: 14px;
        }
        .reset-btn:hover {
            background-color: #c82333;
        }
        .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #eef2f7;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            margin-bottom: 15px;
            gap: 10px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .today-badge {
            background-color: #ff6600;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
            vertical-align: middle;
            display: none;
        }
        .player-list-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }
        .player-list {
            border: 1px solid #ddd;
            padding: 8px;
            margin: 5px 0 10px 0;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        .player-list::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('favicon-512.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 150px 150px;
            opacity: 0.06;
            z-index: 0;
            pointer-events: none;
        }
        .list-header,
        .player-rows {
            position: relative;
            z-index: 1;
        }
        .player-rows {
            max-height: 400px;
            overflow-y: auto;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 2px solid #ccc;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }
        .header-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1.3;
            min-width: 0;
        }
        .header-center-group {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            flex: 1;
        }
        .header-offset-group {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0.8;
            text-align: center;
        }
        .header-right-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            flex: 1;
        }
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #eee;
        }
        .player-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1.3;
            min-width: 0;
        }
        .player-center-group {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            flex: 1;
        }
        .player-offset-group {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0.8;
        }
        .player-right-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            flex: 1;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .player-name-label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .player-item input[type="checkbox"],
        .list-header input[type="checkbox"] {
            transform: scale(1.2);
            flex-shrink: 0;
        }
        .sortable-header {
            cursor: pointer;
            user-select: none;
        }
        .sortable-header:hover {

        }
        .checkin-time {
            font-size: 0.75rem;
            color: #28a745;
            font-weight: bold;
        }
        .stats-badge {
            background: #eef2f7;
            padding: 4px 8px;
            border-radius: 4px;

        .counter-controls {

            gap: 15px;
        }

            }

                margin: 40px auto;

            }
            .card {

            }
            h2 {

            }

        .team {
            flex: 1;
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }
        .team::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('favicon-512.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 90px 90px;
            opacity: 0.08;
            z-index: 0;
            pointer-events: none;
        }
        .team h3,
        .team ol {

        }
        .team h3 {

        }
        .team ol {

        }
        .team li {

        }
        .custom-alert {
            background-color: #fff3cd;

            border: 1px solid #ffeeba;
            padding: 10px 15px;

            justify-content: space-between;
        }

            color: #856404;

            padding: 0 5px;

        }
        .history-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .history-item h4 {

            font-size: 1rem;
            color: #333;
        }

        }
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 2px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2><img src="favicon-192.png" alt="" class="header-icon">Teams Generator & Games Played Tracker</h2>

        <!-- Custom Inline Message Banner -->
        <div id="customAlert" class="custom-alert">
            <span id="customAlertMsg"></span>
            <button onclick="hideAlert()">&times;</button>
        </div>

        <!-- Combined Top Control Row -->
        <div class="control-row">
            <div class="control-group">
                <label for="rosterSelect" style="font-weight: bold; color: #333; font-size: 14px;">Roster:</label>
                <select id="rosterSelect" onchange="switchRoster()">
                    <option value="empty" selected>Custom (Empty)</option>
                    <option value="monday">Monday</option>
                    <option value="tuesday">Tuesday</option>
                    <option value="thursday">Thursday</option>
                    <option value="thursdayGlenOaks">Thursday Glen Oaks</option>
                    <option value="saturday">Saturday</option>
                    <option value="sunday">Sunday</option>
                    <option value="stelton">Stelton</option>
                </select>
                <span id="todayBadge" class="today-badge">Today</span>
            </div>

            <div class="control-group">
                <label for="playersPerTeamInput" style="font-weight: bold; color: #444; font-size: 14px;">Players/team:</label>
                <input type="number" id="playersPerTeamInput" value="5" min="1" max="15">
            </div>

            <button onclick="resetTracker()" class="reset-btn">Reset</button>
        </div>
        
        <!-- Add Player Form -->
        <div style="margin-bottom: 15px; display: flex; gap: 5px;">
            <input type="text" id="newPlayerName" placeholder="Enter player name..." maxlength="16" style="flex: 1; margin-right: 0;">
            <button onclick="addPlayer()">Add</button>
        </div>

        <div class="player-list-container">
            <span>Available players:</span>
            <span id="playerCountDisplay" style="color: #666; font-size: 14px; font-weight: normal;"><b>Available:</b> 0 / 0</span>
        </div>
        
        <!-- Dynamic Checkboxes Container -->
        <div id="playerContainer" class="player-list"></div>

        <button onclick="generateTeams()" style="width: 100%; margin-top: 10px; padding: 12px;" id="generateBtnText">Generate Teams Preview</button>
    </div>

    <div class="card" id="outputCard" style="display:none;">
        <h2>Teams Preview</h2>
        <div class="teams-container">
            <div class="team">
                <h3>Team 1</h3>
                <ol id="team1List"></ol>
            </div>
            <div class="team">
                <h3>Team 2</h3>
                <ol id="team2List"></ol>
            </div>
        </div>
        <!-- Accept Teams Button -->
        <button id="acceptBtn" class="accept-btn" onclick="acceptLineup()">Accept Teams & Update Games Played</button>

        <!-- Copy Teams Button -->
        <button id="copyTeamsBtn" class="copy-btn" onclick="copyTeamsToClipboard()">Copy Teams as Text</button>
    </div>

    <!-- Games Played History -->
    <div class="card" id="historyCard" style="display:none;">
        <h2>Games Played History</h2>
        <div id="historyContainer"></div>
    </div>

    <script>
        /**
         * Builds a roster's player objects from a flat list of names, applying the
         * same default shape to every entry. Centralizes the player object shape so
         * roster definitions can stay compact name lists instead of repeating
         * gamesPlayed/available/checkedIn/etc. by hand for every single player.
         * Names are trimmed defensively so stray whitespace in a roster
         * definition can never cause a false-negative duplicate check later.
         */
        function makeRoster(names) {
            return names.map(name => ({
                name: name.trim(),
                gamesPlayed: 0,
                available: false,
                checkedIn: false,
                checkInTimestamp: null,
                gamesOffset: null
            }));
        }

        const empty = makeRoster([]);

        const monday = makeRoster([
            "Ah B", "Alex", "Aric", "Benny", "Billy", "Brian", "Chris", "Danny", "Deric", "Eric",
            "Fai", "Francis", "Howard", "Jeffrey", "Joe", "Kelvin", "Kenji", "Kenneth", "Kit", "Kobe",
            "Kyth", "Lok", "Pat", "Raymond", "Ricky", "Sunny", "Timmy", "Travis", "Wayne", "奶仔", "蔡哥"
        ]);

        const tuesday = makeRoster([
            "Adrian", "Alex", "Alex friend 1", "Andy", "Angel", "Angel Jr", "Danny", "Derek", "Eric", "Eric Jr",
            "Francis", "Jack", "James", "Jason", "JD", "JD friend 1", "JD friend 2", "JD friend 3", "Kevin", "Lam",
            "Mailman", "Randy", "Ray T", "Wing"
        ]);

        const thursday = makeRoster([
            "Benny", "Bing", "Dan Lau", "Danny", "George", "Giles", "Jack", "James", "Jay", "Kenny",
            "Kok Kit Lee", "Kwok", "Michael Leung", "Michael Poon", "Nelson", "Paul", "Peter", "Phil", "Steve", "Tony",
            "Wai Yip Lee", "William", "二少", "建哥", "梁光远", "韓家聲"
        ]);

        const thursdayGlenOaks = makeRoster([
            "Alex", "Amenophis", "Andrew", "Benghor", "Buddy", "Danny", "David", "Demz", "Devon", "Flippa",
            "Francis", "Fred", "H", "Hing", "Indio", "James", "James Lin", "Jay", "Jimmy", "Joe",
            "JT", "Justin", "Kevin", "KevinBookher", "Kyth", "Li", "Todd", "Tony"
        ]);

        const saturday = makeRoster([
            "Adrian", "Alex", "Amenophis", "Andrew Ng", "Andrew Yu", "Benghor", "Brian", "Buddy", "Corey", "Danny",
            "David", "David Jang", "Demz", "Devon", "Eddie", "Eliezer", "Eric", "Flippa", "Francis", "Fred",
            "G", "Gyu", "H", "Hing", "Indio", "Jabe", "James", "James Lin", "Jason", "Jay",
            "Jim Turvey", "Jimmy", "Joe", "John", "John Kim", "Jon", "Josh", "JT", "Justin", "Kevin",
            "KevinBookher", "Kyth", "Li", "Otari", "Paul", "Rashan", "Ray", "Ricky", "RJ", "Steve",
            "Tasso", "Timothy", "Todd", "Tony"
        ]);

        const sunday = makeRoster([
            "Adrian", "Alex", "Andy", "Angel", "Angel Jr", "Bill", "Daniel", "Danny", "Dofu", "Don",
            "Dong", "Edwin", "Eugene", "Jack", "James", "Jay", "John", "Kasing", "Kent", "Kyo",
            "Mark", "Matthew", "Mike", "Ray", "Randy", "Sit Wong", "Waiho", "Wing", "Yili", "Zai Zai", "梁光远"
        ]).sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'accent' }));

        const stelton = makeRoster([
            "Adi", "Ben", "Brent", "Chad", "Dan", "Danny", "Devin", "Ed", "Giles", "Houdine",
            "Joe", "Joel", "Joey", "Jose", "Keith", "Malik", "Marshall", "Matt", "Mike", "Mike Jr",
            "Pat Lawrence", "Pat Liang", "Phil", "Rafi", "Scott", "Steve Braunstein", "Steve Vlaun", "Troy", "Valeriy"
        ]);

        /**
         * Maps a roster select-option value to its underlying roster array.
         * Single source of truth for this lookup — used by both switchRoster()
         * and resetTracker() so the two never drift out of sync with each other
         * or with the <select> options in the HTML.
         */
        function getRosterByKey(key) {
            const rosterMap = {
                empty: empty,
                monday: monday,
                tuesday: tuesday,
                thursday: thursday,
                thursdayGlenOaks: thursdayGlenOaks,
                saturday: saturday,
                sunday: sunday,
                stelton: stelton
            };
            return rosterMap[key] || empty;
        }

        // Index i = Date.getDay() result (0 = Sunday ... 6 = Saturday). null marks
        // days with no associated roster (Wednesday, Friday), so
        // getDefaultRosterKeyForToday() falls back to the last saved roster.
        // Thursday has two rosters (thursday, thursdayGlenOaks) — 'thursday' is the default.
        const ROSTER_KEY_BY_DAY_OF_WEEK = [
            'sunday', 'monday', 'tuesday', null, 'thursday', null, 'saturday'
        ];

        /**
         * Maps today's day of the week to a roster key, so the app can default
         * to "today's roster" on load. Returns null for days with no
         * associated roster, so the caller can fall back to the last saved
         * roster instead.
         */
        function getDefaultRosterKeyForToday() {
            return ROSTER_KEY_BY_DAY_OF_WEEK[new Date().getDay()] || null;
        }

        // localStorage key prefixes/names — centralized here so every read/write
        // uses the exact same string, with no risk of a typo causing a silent mismatch.
        const STORAGE_KEY_PREFIX = 'teams_tracker_state_';
        const STORAGE_KEY_LAST_ROSTER = 'teams_tracker_last_roster';

        let players = empty.map(p => ({ ...p }));
        // Previewed teams are stored by player NAME, not by index into the
        // players array. Indices go stale whenever that array is re-sorted
        // (e.g. addPlayer()) between Generate and Accept/Copy; names are
        // unique per roster and never change, so they stay valid.
        let pendingTeam1Names = [];
        let pendingTeam2Names = [];
        let lastGameIndices = [];
        let gamesHistory = [];

        // Bundled together since they're one piece of state ("how the player
        // list is currently sorted") rather than two independent values.
        let playerSort = { column: 'name', direction: 'asc' };

        function saveToLocalStorage() {
            const currentRoster = document.getElementById('rosterSelect').value;
            const state = {
                roster: currentRoster,
                players: players,
                gamesHistory: gamesHistory,
                lastGameIndices: lastGameIndices
            };
            localStorage.setItem(STORAGE_KEY_PREFIX + currentRoster, JSON.stringify(state));
            localStorage.setItem(STORAGE_KEY_LAST_ROSTER, currentRoster);
        }

        function loadFromLocalStorage(rosterKey) {
            const savedState = localStorage.getItem(STORAGE_KEY_PREFIX + rosterKey);
            if (savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    players = (parsed.players || []).map(p => {
                        // Migrate legacy "games" key to "gamesPlayed" for data saved before this rename
                        let migratedGamesPlayed = (p.gamesPlayed !== undefined) ? p.gamesPlayed : (p.games || 0);
                        return {
                            // Trimmed defensively — see makeRoster()'s comment; keeps
                            // the duplicate-name check in addPlayer() reliable even
                            // for data saved before this trimming was added.
                            name: (p.name || '').trim(),
                            gamesPlayed: migratedGamesPlayed,
                            available: p.available || false,
                            checkedIn: p.checkedIn || false,
                            checkInTimestamp: (p.checkInTimestamp === undefined) ? null : p.checkInTimestamp,
                            gamesOffset: (p.gamesOffset === undefined) ? null : p.gamesOffset
                        };
                    });
                    gamesHistory = parsed.gamesHistory || [];
                    lastGameIndices = parsed.lastGameIndices || [];
                    return true;
                } catch (e) {
                    console.error("Failed to parse stored state:", e);
                }
            }
            return false;
        }

        /**
         * Effective Games Played: a player's raw gamesPlayed plus their gamesOffset
         * (the average effective games they were credited with at check-in). Used as
         * the fairness basis for both the check-in average calculation and team generation.
         */
        function getEffectiveGamesPlayed(player) {
            let offset = (player.gamesOffset === null || player.gamesOffset === undefined) ? 0 : player.gamesOffset;
            return player.gamesPlayed + offset;
        }

        /**
         * Returns the average effective games played (gamesPlayed + gamesOffset)
         * among all currently checked-in players, floored to an integer. Used as
         * the games-offset value assigned to a player at the moment they check in,
         * so a newcomer is credited with roughly what everyone else has played.
         * Returns 0 if no one is checked in yet.
         */
        function computeCurrentAvgOffset() {
            const checkedInPlayers = players.filter(p => p.checkedIn);
            return checkedInPlayers.length > 0
                ? Math.floor(checkedInPlayers.reduce((sum, p) => sum + getEffectiveGamesPlayed(p), 0) / checkedInPlayers.length)
                : 0;
        }

        /**
         * Recalculates gamesOffset for every currently checked-in player, replaying
         * check-ins in their original chronological order. Each player's offset is
         * recomputed as the average effective games played of everyone who checked
         * in before them — using the freshly corrected gamesPlayed data. This keeps
         * offsets accurate after a game is deleted from history and gamesPlayed
         * counts are decremented.
         *
         * Players whose gamesOffset is currently exactly 0 are pinned there and
         * skipped for reassignment — they stay at 0 regardless of what the
         * recalculated average would otherwise be. They still contribute their own
         * (corrected) effective games played to the running average used for
         * players who checked in after them.
         */
        function recalculateGamesOffsets() {
            let checkedInIndices = players
                .map((p, idx) => idx)
                .filter(idx => players[idx].checkedIn)
                .sort((a, b) => (players[a].checkInTimestamp || 0) - (players[b].checkInTimestamp || 0));

            let processed = [];
            checkedInIndices.forEach(idx => {
                let player = players[idx];
                if (player.gamesOffset !== 0) {
                    let avgGames = processed.length > 0
                        ? Math.floor(processed.reduce((sum, pl) => sum + getEffectiveGamesPlayed(pl), 0) / processed.length)
                        : 0;
                    player.gamesOffset = avgGames;
                }
                processed.push(player);
            });
        }

        /**
         * Formats a checkInTimestamp (ms since epoch, from Date.now()) into a
         * short display string like "03:45 PM" for showing next to a player's
         * Checked In checkbox. Returns an empty string if no timestamp is set.
         */
        function formatCheckInTime(timestamp) {
            if (!timestamp) return '';
            return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        /**
         * Escapes HTML-significant characters in a string before it's interpolated
         * into an innerHTML template. Needed because player names and other
         * user-entered text are set via innerHTML template strings (not textContent,
         * which auto-escapes), so this prevents that content from being interpreted
         * as markup.
         */
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /**
         * Converts a checkInTimestamp into minutes since midnight (local time),
         * matching the same hh:mm granularity shown in the UI via
         * formatCheckInTime(). Used for sorting so two check-ins that display
         * the same hh:mm AM/PM time are correctly treated as ties, rather than
         * being ordered by their exact (invisible) millisecond difference.
         * Returns null if no timestamp is set.
         */
        function getCheckInMinutes(timestamp) {
            if (!timestamp) return null;
            let d = new Date(timestamp);
            return d.getHours() * 60 + d.getMinutes();
        }

        function setSortColumn(column) {
            if (playerSort.column === column) {
                playerSort.direction = (playerSort.direction === 'asc') ? 'desc' : 'asc';
            } else {
                playerSort.column = column;
                // Sensible default per column: names read naturally A-Z,
                // everything else (checkboxes/numbers) reads naturally highest/most-recent-first
                playerSort.direction = (column === 'name') ? 'asc' : 'desc';
            }
            renderPlayerList();
        }

        function getSortedPlayerIndices() {
            let indices = players.map((_, idx) => idx);

            if (playerSort.column === 'name') {
                indices.sort((a, b) => players[a].name.localeCompare(players[b].name, 'en', { sensitivity: 'accent' }));
            } else if (playerSort.column === 'checkedIn') {
                indices.sort((a, b) => {
                    let minutesA = getCheckInMinutes(players[a].checkInTimestamp);
                    let minutesB = getCheckInMinutes(players[b].checkInTimestamp);
                    if (minutesA === null) minutesA = -1;
                    if (minutesB === null) minutesB = -1;
                    if (minutesA !== minutesB) {
                        return minutesA - minutesB;
                    }
                    // Name tiebreaker always reads A→Z regardless of column
                    // sort direction. Since the whole array gets reversed below when
                    // playerSort.direction is 'desc', negate the comparison here so it
                    // lands back in A→Z order after that reversal.
                    let nameCompare = players[a].name.localeCompare(players[b].name, 'en', { sensitivity: 'accent' });
                    return playerSort.direction === 'desc' ? -nameCompare : nameCompare;
                });
            } else if (playerSort.column === 'gamesOffset') {
                indices.sort((a, b) => {
                    let offsetA = (players[a].gamesOffset === null || players[a].gamesOffset === undefined) ? -1 : players[a].gamesOffset;
                    let offsetB = (players[b].gamesOffset === null || players[b].gamesOffset === undefined) ? -1 : players[b].gamesOffset;
                    if (offsetA !== offsetB) {
                        return offsetA - offsetB;
                    }
                    // Name tiebreaker always reads A→Z regardless of column
                    // sort direction — see the same pattern in the checkedIn branch above.
                    let nameCompare = players[a].name.localeCompare(players[b].name, 'en', { sensitivity: 'accent' });
                    return playerSort.direction === 'desc' ? -nameCompare : nameCompare;
                });
            } else if (playerSort.column === 'gamesPlayed') {
                indices.sort((a, b) => {
                    if (players[a].gamesPlayed !== players[b].gamesPlayed) {
                        return players[a].gamesPlayed - players[b].gamesPlayed;
                    }
                    // Name tiebreaker always reads A→Z regardless of column
                    // sort direction — see the same pattern in the checkedIn and
                    // gamesOffset branches above.
                    let nameCompare = players[a].name.localeCompare(players[b].name, 'en', { sensitivity: 'accent' });
                    return playerSort.direction === 'desc' ? -nameCompare : nameCompare;
                });
            }

            if (playerSort.direction === 'desc') {
                indices.reverse();
            }

            return indices;
        }

        /**
         * Returns the HTML for a clickable, sortable column header label,
         * including the ▲/▼ arrow when this column is the active sort column.
         * Replaces the old DOM-node-returning createSortableHeaderLabel() now
         * that renderPlayerList() builds its markup via template strings.
         */
        function sortableHeaderHTML(text, columnKey) {
            let arrow = '';
            if (playerSort.column === columnKey) {
                arrow = playerSort.direction === 'asc' ? ' \u25B2' : ' \u25BC';
            }
            return `<span class="sortable-header" onclick="setSortColumn('${columnKey}')">${escapeHtml(text)}${arrow}</span>`;
        }

        /**
         * Shows/hides the "Today" badge next to the roster dropdown, based on
         * whether the currently selected roster matches today's day-of-week
         * default (see getDefaultRosterKeyForToday()). Called whenever the
         * selected roster changes, so the badge only ever appears next to the
         * roster that was actually auto-selected for today.
         */
        function updateTodayBadge() {
            const badge = document.getElementById('todayBadge');
            const selectedRoster = document.getElementById('rosterSelect').value;
            const todayRosterKey = getDefaultRosterKeyForToday();
            badge.style.display = (todayRosterKey && selectedRoster === todayRosterKey) ? 'inline' : 'none';
        }

        function switchRoster() {
            const selectedRoster = document.getElementById('rosterSelect').value;
            let loaded = loadFromLocalStorage(selectedRoster);

            if (!loaded) {
                let sourceList = getRosterByKey(selectedRoster);
                players = sourceList.map(p => ({ ...p, available: false, checkedIn: false, checkInTimestamp: null, gamesOffset: null }));
                lastGameIndices = [];
                gamesHistory = [];
            }

            pendingTeam1Names = [];
            pendingTeam2Names = [];
            
            document.getElementById('playersPerTeamInput').value = 5;
            document.getElementById('outputCard').style.display = 'none';
            
            hideAlert();
            renderPlayerList();
            renderHistory();
            updateTodayBadge();
            saveToLocalStorage();

            const rowsContainer = document.querySelector('#playerContainer .player-rows');
            if (rowsContainer) {
                rowsContainer.scrollTop = 0;
            }
        }

        function showAlert(message) {
            const alertBox = document.getElementById('customAlert');
            const alertMsg = document.getElementById('customAlertMsg');
            alertMsg.textContent = message;
            alertBox.style.display = 'flex';
        }

        function hideAlert() {
            document.getElementById('customAlert').style.display = 'none';
        }

        function updatePlayerCounts() {
            let total = players.length;
            let availableCount = players.filter(p => p.available).length;
            document.getElementById('playerCountDisplay').innerHTML = `<b>Available:</b> ${availableCount} / ${total}`;
        }

        function toggleSelectAllAvailable(isChecked) {
            if (isChecked) {
                players.forEach((p) => {
                    if (!p.checkedIn) {
                        // Same logic as toggleCheckedIn(): base the offset on the average
                        // effective games played of everyone already checked in so far.
                        p.gamesOffset = computeCurrentAvgOffset();
                        p.checkedIn = true;
                        p.checkInTimestamp = Date.now();
                    }
                    p.available = true;
                });
            } else {
                players.forEach((p) => {
                    p.available = false;
                });
            }

            renderPlayerList();
            saveToLocalStorage();
        }

        function toggleAllCheckedIn(isChecked) {
            if (isChecked) {
                players.forEach((p) => {
                    if (!p.checkedIn) {
                        // Same offset logic as toggleCheckedIn()/toggleSelectAllAvailable():
                        // base it on the average effective games played of everyone
                        // already checked in so far in this loop.
                        p.gamesOffset = computeCurrentAvgOffset();
                        p.checkedIn = true;
                        p.checkInTimestamp = Date.now();
                    }
                    p.available = true;
                });
            } else {
                players.forEach((p) => {
                    p.checkedIn = false;
                    p.available = false;
                    p.checkInTimestamp = null;
                    p.gamesOffset = null;
                });
            }

            renderPlayerList();
            saveToLocalStorage();
        }

        /**
         * Renders the player list: a sortable header row plus one row per
         * player. Builds the whole thing as an HTML string via template
         * literals and sets it in a single innerHTML assignment, rather than
         * constructing each element/attribute individually with
         * document.createElement — same visual result, far less code.
         */
        function renderPlayerList() {
            const container = document.getElementById('playerContainer');

            // Preserve current scroll position before rebuilding
            const existingRows = container.querySelector('.player-rows');
            const previousScrollTop = existingRows ? existingRows.scrollTop : 0;

            let totalCount = players.length;
            let availableCount = players.filter(p => p.available).length;
            let checkedInCount = players.filter(p => p.checkedIn).length;

            let sortedIndices = getSortedPlayerIndices();

            let rowsHtml = sortedIndices.map((index) => {
                let p = players[index];
                let nameColor = p.available ? '#000' : '#888';
                let checkInTimeHtml = (p.checkedIn && p.checkInTimestamp)
                    ? `<span class="checkin-time">${escapeHtml(formatCheckInTime(p.checkInTimestamp))}</span>`
                    : '';
                let offsetText = (p.gamesOffset === null || p.gamesOffset === undefined) ? '-' : p.gamesOffset;

                return `
                    <div class="player-item">
                        <div class="player-left-group">
                            <div class="player-info">
                                <input type="checkbox" id="available_${index}" ${p.available ? 'checked' : ''}
                                    onchange="toggleAvailable(${index}, this.checked)">
                                <label for="available_${index}" class="player-name-label" style="cursor: pointer; color: ${nameColor};" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</label>
                            </div>
                        </div>
                        <div class="player-center-group">
                            <input type="checkbox" id="checkedIn_${index}" ${p.checkedIn ? 'checked' : ''}
                                onchange="toggleCheckedIn(${index}, this.checked)">
                            ${checkInTimeHtml}
                        </div>
                        <div class="player-offset-group">
                            <span class="stats-badge">${offsetText}</span>
                        </div>
                        <div class="player-right-group">
                            <div class="counter-controls" style="display: flex; align-items: center; gap: 8px;">
                                <button class="counter-btn" onclick="adjustGames(${index}, -1)">-</button>
                                <span class="stats-badge">${p.gamesPlayed}</span>
                                <button class="counter-btn" onclick="adjustGames(${index}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="list-header">
                    <div class="header-left-group">
                        <input type="checkbox" id="selectAllCheckbox" ${(totalCount > 0 && availableCount === totalCount) ? 'checked' : ''}
                            onchange="toggleSelectAllAvailable(this.checked)">
                        ${sortableHeaderHTML("Player Name", 'name')}
                    </div>
                    <div class="header-center-group">
                        <input type="checkbox" id="selectAllCheckedInCheckbox" ${(totalCount > 0 && checkedInCount === totalCount) ? 'checked' : ''}
                            onchange="toggleAllCheckedIn(this.checked)">
                        ${sortableHeaderHTML("Checked In", 'checkedIn')}
                    </div>
                    <div class="header-offset-group">
                        ${sortableHeaderHTML("Games Offset", 'gamesOffset')}
                    </div>
                    <div class="header-right-group">
                        ${sortableHeaderHTML("Games Played", 'gamesPlayed')}
                    </div>
                </div>
                <div class="player-rows">${rowsHtml}</div>
            `;

            // "indeterminate" can't be expressed via an HTML attribute, so it's
            // set imperatively here right after the markup is inserted.
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (selectAllCheckbox) {
                selectAllCheckbox.indeterminate = availableCount > 0 && availableCount < totalCount;
            }
            const selectAllCheckedInCheckbox = document.getElementById('selectAllCheckedInCheckbox');
            if (selectAllCheckedInCheckbox) {
                selectAllCheckedInCheckbox.indeterminate = checkedInCount > 0 && checkedInCount < totalCount;
            }

            // Restore scroll position after rebuilding the list
            const rowsContainer = container.querySelector('.player-rows');
            if (rowsContainer) {
                rowsContainer.scrollTop = previousScrollTop;
            }

            updatePlayerCounts();
        }

        function addPlayer() {
            const input = document.getElementById('newPlayerName');
            const name = input.value.trim();
            if (name === "") {
                return;
            }
            if (name.length > 16) {
                showAlert("Player name must be 16 characters or fewer.");
                return;
            }
            // Both sides trimmed defensively: "name" is already trimmed above,
            // and p.name is trimmed at every entry point (makeRoster(),
            // loadFromLocalStorage()) — trimming here too means this check
            // can never be fooled by stray whitespace regardless of source.
            const isDuplicate = players.some(p => p.name.trim().localeCompare(name, 'en', { sensitivity: 'accent' }) === 0);
            if (isDuplicate) {
                showAlert(`"${name}" is already on this roster.`);
                return;
            }
            players.push({ name: name, gamesPlayed: 0, available: false, checkedIn: false, checkInTimestamp: null, gamesOffset: null });
            players.sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'accent' }));
            input.value = '';
            hideAlert();
            renderPlayerList();
            saveToLocalStorage();
        }

        function toggleAvailable(index, isAvailable) {
            players[index].available = isAvailable;

            // If marking available and they aren't checked in yet, auto check them in
            if (isAvailable && !players[index].checkedIn) {
                toggleCheckedIn(index, true);
                return; // toggleCheckedIn() already re-renders and saves
            }

            renderPlayerList();
            saveToLocalStorage();
        }

        function toggleCheckedIn(index, isCheckedIn) {
            if (isCheckedIn) {
                // Record this check-in's games offset snapshot (used as a fairness input during team generation)
                players[index].gamesOffset = computeCurrentAvgOffset();

                players[index].checkedIn = true;
                players[index].available = true;
                players[index].checkInTimestamp = Date.now();
            } else {
                players[index].checkedIn = false;
                players[index].available = false;
                players[index].checkInTimestamp = null;
                players[index].gamesOffset = null;
            }

            renderPlayerList();
            saveToLocalStorage();
        }

        function adjustGames(index, amount) {
            players[index].gamesPlayed += amount;
            if (players[index].gamesPlayed < 0) {
                players[index].gamesPlayed = 0;
            }
            renderPlayerList();
            saveToLocalStorage();
        }

        function resetTracker() {
            const currentRoster = document.getElementById('rosterSelect').value;
            localStorage.removeItem(STORAGE_KEY_PREFIX + currentRoster);

            let sourceList = getRosterByKey(currentRoster);
            players = sourceList.map(p => ({ ...p, available: false, checkedIn: false, checkInTimestamp: null, gamesOffset: null }));
            lastGameIndices = [];
            pendingTeam1Names = [];
            pendingTeam2Names = [];
            gamesHistory = [];
            document.getElementById('playersPerTeamInput').value = 5;
            document.getElementById('newPlayerName').value = '';
            document.getElementById('outputCard').style.display = 'none';
            hideAlert();
            renderPlayerList();
            renderHistory();
            saveToLocalStorage();

            const rowsContainer = document.querySelector('#playerContainer .player-rows');
            if (rowsContainer) {
                rowsContainer.scrollTop = 0;
            }
        }

        function generateTeams() {
            hideAlert();
    
            // 1. Read input configuration
            let perTeamInput = parseInt(document.getElementById('playersPerTeamInput').value);
            if (isNaN(perTeamInput) || perTeamInput < 1) {
                showAlert("Please enter a valid number of players per team!");
                return;
            }

            // 2. Filter for available players
            let selectedIndices = [];
            players.forEach((p, index) => {
                if (p.available) {
                    selectedIndices.push(index);
                }
            });

            let requiredTotal = perTeamInput * 2;
            if (selectedIndices.length < requiredTotal) {
                showAlert(`Please select at least ${requiredTotal} available players to form two ${perTeamInput}-player teams!`);
                return;
            }

            /**
             * Streak Score Helper:
             * - Returns a NEGATIVE number for consecutive games SAT OUT (e.g., -2 = sat out 2 straight games).
             * - Returns a POSITIVE number for consecutive games PLAYED (e.g., +2 = played 2 straight games).
             * - Returns 0 if no games have been recorded yet.
             */
            function getStreakScore(playerIndex) {
                let playerName = players[playerIndex].name;
                if (gamesHistory.length === 0) return 0;

                // Check last game played state
                let lastGame = gamesHistory[gamesHistory.length - 1];
                let playedLast = lastGame.team1.includes(playerName) || lastGame.team2.includes(playerName);

                let streak = 0;
                for (let i = gamesHistory.length - 1; i >= 0; i--) {
                    let game = gamesHistory[i];
                    let playedInGame = game.team1.includes(playerName) || game.team2.includes(playerName);

                    if (playedInGame === playedLast) {
                        streak++;
                    } else {
                        break;
                    }
                }

                return playedLast ? streak : -streak;
            }

            // 3. Group players by their exact streak score
            let groupedMap = {};
            selectedIndices.forEach(i => {
                let score = getStreakScore(i);
                if (!groupedMap[score]) groupedMap[score] = [];
                groupedMap[score].push(i);
            });

            // 4. Sort groups ascending (most negative scores first = highest priority)
            let prioritizedIndices = [];
            Object.keys(groupedMap)
                .map(Number)
                .sort((a, b) => a - b)
                .forEach(score => {
                    let group = groupedMap[score];

                    // Pre-shuffle so any exact ties in effective games played land in random order
                    group.sort(() => Math.random() - 0.5);

                    // Within each streak tier, prioritize players with fewer effective games played
                    // (gamesPlayed + gamesOffset) — sort() is stable, so the random pre-shuffle
                    // above still governs exact ties
                    group.sort((a, b) => getEffectiveGamesPlayed(players[a]) - getEffectiveGamesPlayed(players[b]));

                    prioritizedIndices.push(...group);
                });

            // 5. Select the top required players and split into teams
            let totalNeeded = perTeamInput * 2;
            let chosenPlayers = prioritizedIndices.slice(0, totalNeeded);
    
            // Randomly divide chosen players between Team 1 and Team 2
            chosenPlayers.sort(() => Math.random() - 0.5);

            // Store names rather than array indices: indices go stale if the
            // players array is re-sorted (e.g. addPlayer()) before Accept/Copy.
            // Sorted alphabetically for visual presentation.
            const byName = (a, b) => a.localeCompare(b, 'en', { sensitivity: 'accent' });
            pendingTeam1Names = chosenPlayers.slice(0, perTeamInput).map(i => players[i].name).sort(byName);
            pendingTeam2Names = chosenPlayers.slice(perTeamInput, totalNeeded).map(i => players[i].name).sort(byName);

            // 6. Update UI
            const team1List = document.getElementById('team1List');
            const team2List = document.getElementById('team2List');
    
            team1List.innerHTML = '';
            team2List.innerHTML = '';

            pendingTeam1Names.forEach(name => {
                let li = document.createElement('li');
                li.textContent = name;
                team1List.appendChild(li);
            });

            pendingTeam2Names.forEach(name => {
                let li = document.createElement('li');
                li.textContent = name;
                team2List.appendChild(li);
            });

            const acceptBtn = document.getElementById('acceptBtn');
            acceptBtn.disabled = false;
            acceptBtn.textContent = "Accept Teams & Update Games Played";

            document.getElementById('outputCard').style.display = 'block';
        }

        function copyTeamsToClipboard() {
            if (pendingTeam1Names.length === 0 && pendingTeam2Names.length === 0) {
                showAlert("Generate teams first before copying.");
                return;
            }

            let lines = [];
            lines.push("Team 1:");
            pendingTeam1Names.forEach((name, idx) => {
                lines.push(`${idx + 1}. ${name}`);
            });
            lines.push("");
            lines.push("Team 2:");
            pendingTeam2Names.forEach((name, idx) => {
                lines.push(`${idx + 1}. ${name}`);
            });

            let teamsText = lines.join("\n");

            const copyBtn = document.getElementById('copyTeamsBtn');
            const originalText = copyBtn ? copyBtn.textContent : null;

            function showCopiedFeedback() {
                if (copyBtn) {
                    copyBtn.textContent = "Copied!";
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                    }, 1500);
                }
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(teamsText).then(showCopiedFeedback).catch(() => {
                    fallbackCopyText(teamsText, showCopiedFeedback);
                });
            } else {
                fallbackCopyText(teamsText, showCopiedFeedback);
            }
        }

        function fallbackCopyText(text, onSuccess) {
            let textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                if (onSuccess) onSuccess();
            } catch (e) {
                showAlert("Unable to copy teams. Please copy manually.");
            }
            document.body.removeChild(textarea);
        }

        function acceptLineup() {
            const selectedNames = new Set([...pendingTeam1Names, ...pendingTeam2Names]);

            players.forEach(p => {
                if (p.available && selectedNames.has(p.name)) {
                    p.gamesPlayed++;
                }
            });

            // Resolved fresh from names against the current array order
            lastGameIndices = players
                .map((p, idx) => selectedNames.has(p.name) ? idx : -1)
                .filter(idx => idx !== -1);
            renderPlayerList();

            // Add to games history with the current date/time as a display
            // string only. We do NOT store or sort by a numeric timestamp
            // (e.g. Date.now()) — see getSortedHistoryIndices() for why.
            gamesHistory.push({
                team1: [...pendingTeam1Names],
                team2: [...pendingTeam2Names],
                timestamp: new Date().toLocaleString()
            });
            renderHistory();
            saveToLocalStorage();

            const acceptBtn = document.getElementById('acceptBtn');
            acceptBtn.disabled = true;
            acceptBtn.textContent = "Accept Teams & Update Games Played";
        }

        function deleteGame(historyIndex) {
            let game = gamesHistory[historyIndex];
            
            // Decrement games played count for players who were in this game entry
            let allPlayerNames = [...game.team1, ...game.team2];
            allPlayerNames.forEach(name => {
                let player = players.find(p => p.name === name);
                if (player && player.gamesPlayed > 0) {
                    player.gamesPlayed--;
                }
            });

            // Remove game entry from history
            gamesHistory.splice(historyIndex, 1);

            // Update lastGameIndices to reflect the most recent remaining game,
            // or clear if empty
            if (gamesHistory.length > 0) {
                // Array position is the authoritative chronological order (see
                // getSortedHistoryIndices()), so the most recent remaining game
                // is simply the last element.
                let mostRecentIdx = gamesHistory.length - 1;
                let lastGame = gamesHistory[mostRecentIdx];
                let lastGameNames = [...lastGame.team1, ...lastGame.team2];
                lastGameIndices = players
                    .map((p, idx) => lastGameNames.includes(p.name) ? idx : -1)
                    .filter(idx => idx !== -1);
            } else {
                lastGameIndices = [];
            }

            recalculateGamesOffsets();
            renderPlayerList();
            renderHistory();
            saveToLocalStorage();
        }

        /**
         * Returns gamesHistory indices in newest-first order. Games are always
         * appended via push() in acceptLineup(), so array position already IS
         * the true chronological order — reversing it is sufficient.
         *
         * This intentionally does NOT sort by any wall-clock timestamp
         * (e.g. Date.now()). System clocks are not guaranteed to move only
         * forward — NTP sync, DST transitions, or a manual/automatic clock
         * adjustment can make it jump backward — which would give a later
         * game a smaller timestamp than an earlier one and put them in the
         * wrong order, persistently, once saved. Array position has no such
         * failure mode.
         */
        function getSortedHistoryIndices() {
            return gamesHistory.map((_, idx) => idx).reverse();
        }

        /**
         * Renders the Games Played History card: one entry per game, newest
         * first. Builds the whole thing as an HTML string via template
         * literals and sets it in a single innerHTML assignment, rather than
         * constructing each element with document.createElement.
         */
        function renderHistory() {
            const historyContainer = document.getElementById('historyContainer');
            const historyCard = document.getElementById('historyCard');

            if (gamesHistory.length === 0) {
                historyContainer.innerHTML = '';
                historyCard.style.display = 'none';
                return;
            }

            historyCard.style.display = 'block';

            historyContainer.innerHTML = getSortedHistoryIndices().map((index) => {
                let game = gamesHistory[index];
                let team1Html = game.team1.map(name => `<li>${escapeHtml(name)}</li>`).join('');
                let team2Html = game.team2.map(name => `<li>${escapeHtml(name)}</li>`).join('');

                return `
                    <div class="history-item">
                        <div class="history-item-header">
                            <h4>Game ${index + 1}</h4>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span class="history-timestamp">${escapeHtml(game.timestamp)}</span>
                                <button class="delete-btn" onclick="deleteGame(${index})">Delete</button>
                            </div>
                        </div>
                        <div class="teams-container">
                            <div class="team">
                                <h3>Team 1</h3>
                                <ol>${team1Html}</ol>
                            </div>
                            <div class="team">
                                <h3>Team 2</h3>
                                <ol>${team2Html}</ol>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Initialize state on page load. Default to today's roster if one
        // exists; otherwise fall back to whichever roster was last used.
        const todayRoster = getDefaultRosterKeyForToday();
        const initialRoster = todayRoster || localStorage.getItem(STORAGE_KEY_LAST_ROSTER) || 'empty';
        document.getElementById('rosterSelect').value = initialRoster;
        switchRoster();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
