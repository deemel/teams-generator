<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams Generator & Games Played Tracker</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6600">
    <link rel="apple-touch-icon" href="favicon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Teams Tracker">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 10px auto;
            padding: 10px;
            background-color: #f4f4f9;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        h2 {
            font-size: 1.3rem;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-icon {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        input[type="text"] {
            padding: 10px;
            width: calc(100% - 100px);
            box-sizing: border-box;
            margin-right: 5px;
            font-size: 16px;
        }
        input[type="number"] {
            padding: 8px;
            width: 60px;
            font-size: 16px;
        }
        select {
            padding: 8px 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: white;
            cursor: pointer;
        }
        button {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e55c00;
        }
        .generate-btn {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
        }
        .accept-btn {
            background-color: #28a745;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
            padding: 12px;
        }
        .accept-btn:hover {
            background-color: #218838;
        }
        .accept-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .copy-btn {
            background-color: #17a2b8;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
            padding: 12px;
        }
        .copy-btn:hover {
            background-color: #138496;
        }
        .reset-btn {
            background-color: #dc3545;
            padding: 8px 12px;
            font-size: 14px;
        }
        .reset-btn:hover {
            background-color: #c82333;
        }
        .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #eef2f7;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            margin-bottom: 15px;
            gap: 10px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-label {
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }
        .today-badge {
            background-color: #ff6600;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
            vertical-align: middle;
            display: none;
        }
        .add-player-row {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .add-player-row input[type="text"] {
            flex: 1;
            margin-right: 0;
        }
        .player-list-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }
        .player-count {
            color: #666;
            font-size: 14px;
            font-weight: normal;
        }
        .player-list {
            border: 1px solid #ddd;
            padding: 8px;
            margin: 5px 0 10px 0;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        .player-list::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('favicon-512.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 150px 150px;
            opacity: 0.06;
            z-index: 0;
            pointer-events: none;
        }

        /* ---- Scrolling area ----
           The header row and all player rows live in one scroll container
           that scrolls both vertically and horizontally, so the header always
           moves sideways together with the rows. Both scrollbars are always
           shown: overflow: scroll always reserves them, and the
           ::-webkit-scrollbar styling turns them into classic scrollbars that
           stay visible instead of overlay ones that only appear while
           scrolling (macOS and Android browsers otherwise hide them).
           scrollbar-color covers Firefox's colors. */
        .player-rows {
            position: relative;
            z-index: 1;
            max-height: 400px;
            overflow: scroll;
            scrollbar-color: #bbb #f0f0f0;
        }
        .player-rows::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .player-rows::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 4px;
        }
        .player-rows::-webkit-scrollbar-thumb {
            background: #bbb;
            border-radius: 4px;
        }
        .player-rows::-webkit-scrollbar-corner {
            background: #f0f0f0;
        }

        /* The header row stays pinned to the top while scrolling down. Its
           white background hides the rows scrolling underneath it.
           min-width: max-content (here and on .player-item) lets a row grow
           wider than the visible area, which is what makes it scroll sideways;
           every row and the header end up the same width, so the columns
           stay lined up. */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 2px solid #ccc;
            font-weight: bold;
            color: #444;
            font-size: 14px;
            position: sticky;
            top: 0;
            z-index: 3;
            background: white;
            min-width: max-content;
        }
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #eee;
            min-width: max-content;
        }
        /* Gap between the header row and the first player row */
        .list-header + .player-item {
            margin-top: 8px;
        }

        /* ---- Column layout ----
           The Player column is sized by updatePlayerColumnWidth() to fit the
           longest name (plus a little room), via the --player-col-width
           variable set on the list, and never shrinks. Every other column has
           a fixed width sized to its content. When the columns don't all fit,
           the list scrolls sideways; when there's room to spare, it's shared
           evenly between the columns (justify-content: space-between).
           Every rule covers both the header cell and the row cells, so the
           columns always line up. nowrap on the header cells keeps a sort
           arrow on the same line as its label. */

        /* Player: availability checkbox plus name, pinned to the left edge
           while the other columns scroll sideways underneath it. The white
           background hides them as they pass, and the shadow marks its edge. */
        .header-left-group,
        .player-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 var(--player-col-width, auto);
            min-width: 0;
            position: sticky;
            left: 0;
            z-index: 1;
            background: white;
            box-shadow: 4px 0 4px -4px rgba(0, 0, 0, 0.2);
        }
        /* Since: the time the player became available */
        .header-center-group,
        .player-center-group {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex: 0 0 60px;
        }
        .header-center-group {
            white-space: nowrap;
        }
        /* GPO: -/+ buttons around the offset value (which may have a decimal) */
        .header-offset-group,
        .player-offset-group {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 112px;
        }
        .header-offset-group {
            white-space: nowrap;
        }
        /* GP and Strk: a short whole number each */
        .header-right-group,
        .header-streak-group,
        .player-right-group,
        .player-streak-group {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 42px;
        }
        /* EGP: a little wider, since it may have a decimal */
        .header-eff-group,
        .player-eff-group {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 52px;
        }
        .header-right-group,
        .header-eff-group,
        .header-streak-group {
            white-space: nowrap;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .player-name-label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            color: #000;
        }
        .player-name-label.unavailable {
            color: #888;
        }
        /* One rule for every checkbox in the header and the rows. The
           browser's default checkbox is drawn 20% larger with scale(1.2);
           change that number to resize all checkboxes at once. The shared
           margin keeps the "check all" box directly above the boxes below
           it (browser defaults could otherwise shift one set slightly),
           and leaves room for the enlargement, which doesn't take up layout
           space of its own. */
        .player-item input[type="checkbox"],
        .list-header input[type="checkbox"] {
            transform: scale(1.2);
            flex-shrink: 0;
            margin: 0 2px;
        }
        .sortable-header {
            cursor: pointer;
            user-select: none;
        }
        .sortable-header:hover {
            text-decoration: underline;
        }
        .since-time {
            font-size: 0.75rem;
            color: #28a745;
            font-weight: bold;
        }
        .stats-badge {
            background: #eef2f7;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
            display: inline-block;
            min-width: 2ch;
            text-align: center;
        }
        .counter-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .counter-btn {
            padding: 4px 8px;
            font-size: 14px;
            background-color: #ddd;
            color: #333;
            min-width: 28px;
        }
        .counter-btn:hover {
            background-color: #ccc;
        }
        .teams-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        @media (min-width: 500px) {
            .teams-container {
                flex-direction: row;
            }
            body {
                margin: 40px auto;
                padding: 20px;
            }
            .card {
                padding: 20px;
            }
            h2 {
                font-size: 1.5rem;
            }
        }
        .team {
            flex: 1;
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }
        .team::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('favicon-512.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 90px 90px;
            opacity: 0.08;
            z-index: 0;
            pointer-events: none;
        }
        .team h3,
        .team ol {
            position: relative;
            z-index: 1;
        }
        .team h3 {
            margin-top: 0;
        }
        .team ol {
            margin: 0;
            padding-left: 20px;
        }
        .team li {
            margin-bottom: 4px;
            font-size: 15px;
        }
        .custom-alert {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
            align-items: center;
            justify-content: space-between;
        }
        .custom-alert button {
            background: transparent;
            color: #856404;
            font-size: 18px;
            padding: 0 5px;
            cursor: pointer;
        }
        .history-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .history-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-item h4 {
            margin: 0;
            font-size: 1rem;
            color: #333;
        }
        .history-timestamp {
            font-size: 0.85rem;
            color: #666;
            font-weight: normal;
        }
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 2px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
        .app-version {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2><img src="favicon-192.png" alt="" class="header-icon">Teams Generator & Games Played Tracker</h2>

        <!-- Custom Inline Message Banner -->
        <div id="customAlert" class="custom-alert">
            <span id="customAlertMsg"></span>
            <button onclick="hideAlert()">&times;</button>
        </div>

        <!-- Combined Top Control Row -->
        <div class="control-row">
            <div class="control-group">
                <label for="rosterSelect" class="control-label">Roster:</label>
                <!-- Options are generated from ROSTERS by renderRosterOptions() -->
                <select id="rosterSelect" onchange="onRosterSelected()"></select>
                <span id="todayBadge" class="today-badge">Today</span>
            </div>

            <div class="control-group">
                <label for="playersPerTeamInput" class="control-label">Players/team:</label>
                <input type="number" id="playersPerTeamInput" value="5" min="1" max="15">
            </div>

            <button onclick="resetTracker()" class="reset-btn">Reset</button>
        </div>
        
        <!-- Add Player Form -->
        <div class="add-player-row">
            <input type="text" id="newPlayerName" placeholder="Enter player..." maxlength="16">
            <button onclick="addPlayer()">Add</button>
        </div>

        <!-- Available count, filled in by updatePlayerCounts() -->
        <div class="player-list-container">
            <span id="playerCountDisplay" class="player-count"><b>Available players:</b> 0 / 0</span>
        </div>
        
        <!-- Dynamic Checkboxes Container -->
        <div id="playerContainer" class="player-list"></div>

        <button onclick="generateTeams()" class="generate-btn">Generate Teams Preview</button>
    </div>

    <div class="card" id="outputCard" style="display:none;">
        <h2>Teams Preview</h2>
        <div class="teams-container">
            <div class="team">
                <h3>Team 1</h3>
                <ol id="team1List"></ol>
            </div>
            <div class="team">
                <h3>Team 2</h3>
                <ol id="team2List"></ol>
            </div>
        </div>
        <!-- Accept Teams Button -->
        <button id="acceptBtn" class="accept-btn" onclick="acceptLineup()">Accept Teams & Update Games Played</button>

        <!-- Copy Teams Button -->
        <button id="copyTeamsBtn" class="copy-btn" onclick="copyTeamsToClipboard()">Copy Teams as Text</button>
    </div>

    <!-- Games Played History -->
    <div class="card" id="historyCard" style="display:none;">
        <h2>Games Played History</h2>
        <div id="historyContainer"></div>
    </div>

    <!-- Filled in by showAppVersion() with the active service worker's CACHE_NAME -->
    <div id="appVersion" class="app-version"></div>

    <script>
        /**
         * Creates a player object with every field at its starting value. The
         * single source of truth for the player shape: rosters, Reset, and
         * addPlayer() all build players here, so a new field only needs adding
         * once. Names are trimmed defensively so stray whitespace can never cause
         * a false-negative duplicate check in addPlayer().
         */
        function createPlayer(name) {
            return {
                name: name.trim(),
                gamesPlayed: 0,
                available: false,
                // When the player's current stretch of availability began
                // (ms since epoch), shown in the Since column.
                availableTimestamp: null,
                // Manual -/+ adjustment from the GPO column. Kept through
                // breaks; only Reset clears it.
                offsetAdjustment: 0,
                // Stretches of game history the player was available for, as
                // { from, to } history positions (to is null while they're
                // still available). The streak (getStreakScore()) and the
                // credit for missed games (getMissedGamesCredit()) are both
                // worked out from these; see markAvailable() and
                // markUnavailable().
                availability: []
            };
        }

        /**
         * Compares two player names for sorting and duplicate checks. The one
         * place the comparison rule is defined: case-insensitive but
         * accent-sensitive ("alex" equals "Alex", "José" doesn't equal "Jose").
         * A function declaration (not a const arrow) so it's usable by the
         * roster sorts below, which run before this point in the script.
         */
        function compareNames(a, b) {
            return a.localeCompare(b, 'en', { sensitivity: 'accent' });
        }

        /**
         * Whether the named player was on either team in the given game.
         */
        function playedIn(game, name) {
            return game.team1.includes(name) || game.team2.includes(name);
        }

        /**
         * Rounds to two decimal places. Applied to credits and effective games
         * played so that values which should be equal compare as equal,
         * instead of differing by tiny floating-point errors.
         */
        function roundToHundredths(value) {
            return Math.round(value * 100) / 100;
        }

        /**
         * Formats a GPO or EGP value for display: whole numbers as-is, others
         * to one decimal place ("4", "4.3"). The exact value is still used for
         * sorting and team selection.
         */
        function formatNumber(value) {
            return Number.isInteger(value) ? String(value) : value.toFixed(1);
        }

        /**
         * Every roster the app offers, in dropdown order. The single place to add,
         * rename, reorder, or remove a roster: the dropdown (renderRosterOptions())
         * and Reset (getRosterNames()) are both built from this. Keys must match
         * those used in ROSTER_KEY_BY_DAY_OF_WEEK.
         */
        const ROSTERS = {
            empty: {
                label: "Custom (Empty)",
                names: []
            },
            monday: {
                label: "Monday",
                names: [
                    "Ah B", "Alex", "Aric", "Benny", "Billy", "Brian", "Chris", "Danny", "Deric", "Eric",
                    "Fai", "Francis", "Howard", "Jeffrey", "Joe", "Kelvin", "Kenji", "Kenneth", "Kit", "Kobe",
                    "Kyth", "Lok", "Pat", "Raymond", "Ricky", "Sunny", "Timmy", "Travis", "Wayne", "奶仔", "蔡哥"
                ]
            },
            tuesday: {
                label: "Tuesday",
                names: [
                    "Adrian", "Alex", "Alex friend 1", "Andy", "Angel", "Angel Jr", "Danny", "Derek", "Eric", "Eric Jr",
                    "Francis", "Jack", "James", "Jason", "JD", "JD friend 1", "JD friend 2", "JD friend 3", "Kevin", "Lam",
                    "Mailman", "Randy", "Ray T", "Wing"
                ]
            },
            thursday: {
                label: "Thursday",
                names: [
                    "Benny", "Bing", "Dan Lau", "Danny", "George", "Giles", "Jack", "James", "Jay", "Kenny",
                    "Kok Kit Lee", "Kwok", "Michael Leung", "Michael Poon", "Nelson", "Paul", "Peter", "Phil", "Steve", "Tony",
                    "Wai Yip Lee", "William", "二少", "建哥", "梁光远", "韓家聲"
                ]
            },
            thursdayGlenOaks: {
                label: "Thursday Glen Oaks",
                names: [
                    "Alex", "Amenophis", "Andrew", "Benghor", "Buddy", "Danny", "David", "Demz", "Devon", "Flippa",
                    "Francis", "Fred", "H", "Hing", "Indio", "James", "James Lin", "Jay", "Jimmy", "Joe",
                    "JT", "Justin", "Kevin", "KevinBookher", "Kyth", "Li", "Todd", "Tony"
                ]
            },
            saturday: {
                label: "Saturday",
                names: [
                    "Adrian", "Alex", "Amenophis", "Andrew Ng", "Andrew Yu", "Benghor", "Brian", "Buddy", "Corey", "Danny",
                    "David", "David Jang", "Demz", "Devon", "Eddie", "Eliezer", "Eric", "Flippa", "Francis", "Fred",
                    "G", "Gyu", "H", "Hing", "Indio", "Jabe", "James", "James Lin", "Jason", "Jay",
                    "Jim Turvey", "Jimmy", "Joe", "John", "John Kim", "Jon", "Josh", "JT", "Justin", "Kevin",
                    "KevinBookher", "Kyth", "Li", "Otari", "Paul", "Rashan", "Ray", "Ricky", "RJ", "Steve",
                    "Tasso", "Timothy", "Todd", "Tony"
                ]
            },
            sunday: {
                label: "Sunday",
                names: [
                    "Adrian", "Alex", "Andy", "Angel", "Angel Jr", "Bill", "Daniel", "Danny", "Dofu", "Don",
                    "Dong", "Edwin", "Eugene", "Jack", "James", "Jay", "John", "Kasing", "Kent", "Kyo",
                    "Mark", "Matthew", "Mike", "Ray", "Randy", "Sit Wong", "Waiho", "Wing", "Yili", "Zai Zai", "梁光远"
                ].sort(compareNames)
            },
            stelton: {
                label: "Stelton",
                names: [
                    "Adi", "Ben", "Brent", "Chad", "Dan", "Danny", "Devin", "Ed", "Giles", "Houdine",
                    "Joe", "Joel", "Joey", "Jose", "Keith", "Malik", "Marshall", "Matt", "Mike", "Mike Jr",
                    "Pat Lawrence", "Pat Liang", "Phil", "Rafi", "Scott", "Steve Braunstein", "Steve Vlaun", "Troy", "Valeriy"
                ]
            }
        };

        /**
         * Returns the player names for a roster key, falling back to the empty
         * roster for unknown keys.
         */
        function getRosterNames(key) {
            return (ROSTERS[key] || ROSTERS.empty).names;
        }

        /**
         * Fills the roster dropdown from ROSTERS, in its key order. Called once
         * at startup, before the initial roster is selected.
         */
        function renderRosterOptions() {
            document.getElementById('rosterSelect').innerHTML = Object.entries(ROSTERS)
                .map(([key, roster]) => `<option value="${escapeHtml(key)}">${escapeHtml(roster.label)}</option>`)
                .join('');
        }

        // Index i = Date.getDay() result (0 = Sunday ... 6 = Saturday). null marks
        // days with no associated roster (Wednesday, Friday), so startup falls
        // back to the empty Custom roster.
        // Thursday has two rosters (thursday, thursdayGlenOaks) — 'thursday' is the default.
        const ROSTER_KEY_BY_DAY_OF_WEEK = [
            'sunday', 'monday', 'tuesday', null, 'thursday', null, 'saturday'
        ];

        /**
         * Maps today's day of the week to a roster key, so the app can default
         * to "today's roster" on load. Returns null for days with no
         * associated roster, so startup falls back to the empty Custom roster.
         */
        function getDefaultRosterKeyForToday() {
            return ROSTER_KEY_BY_DAY_OF_WEEK[new Date().getDay()] || null;
        }

        // The app keeps nothing between loads. Older versions saved session state
        // and the last-used roster under keys with this prefix;
        // clearLegacySavedState() removes any left behind.
        const LEGACY_STORAGE_KEY_PREFIX = 'teams_tracker_';

        /**
         * Removes state saved by older versions of the app. Keys are collected
         * first, since removing items while iterating localStorage by index
         * would shift the remaining indices.
         */
        function clearLegacySavedState() {
            const legacyKeys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(LEGACY_STORAGE_KEY_PREFIX)) {
                    legacyKeys.push(key);
                }
            }
            legacyKeys.forEach(key => localStorage.removeItem(key));
        }

        let players = [];
        // Previewed teams are stored by player NAME, not by index into the
        // players array. Indices go stale whenever that array is re-sorted
        // (e.g. addPlayer()) between Generate and Accept/Copy; names are
        // unique per roster and never change, so they stay valid.
        let pendingTeam1Names = [];
        let pendingTeam2Names = [];
        let gamesHistory = [];

        // Bundled together since they're one piece of state ("how the player
        // list is currently sorted") rather than two independent values.
        let playerSort = { column: 'name', direction: 'asc' };

        // ---- Availability ----------------------------------------------------

        /**
         * Marks a player available, starting a new stretch of availability at
         * the current point in history and recording the time for the Since
         * column. Only acts on a real unavailable→available change.
         *
         * If their last stretch ended exactly here (no game has been recorded
         * since they were marked unavailable, e.g. an accidental tap, or
         * unchecking and rechecking everyone), that stretch is reopened
         * instead, keeping its original time, so the toggle changes nothing.
         */
        function markAvailable(player) {
            if (player.available) return;
            player.available = true;

            const last = player.availability[player.availability.length - 1];
            if (last && last.to === gamesHistory.length) {
                last.to = null;
            } else {
                player.availability.push({ from: gamesHistory.length, to: null });
                player.availableTimestamp = Date.now();
            }
        }

        /**
         * Marks a player unavailable, ending their current stretch of
         * availability at the current point in history. Marking an
         * already-unavailable player again changes nothing.
         */
        function markUnavailable(player) {
            if (player.available) {
                const last = player.availability[player.availability.length - 1];
                if (last) last.to = gamesHistory.length;
            }
            player.available = false;
        }

        /**
         * Whether the player was available for the game at `gameIndex` in
         * history, i.e. it falls inside one of their stretches of availability.
         */
        function wasAvailableFor(player, gameIndex) {
            return player.availability.some(span =>
                span.from <= gameIndex && (span.to === null || gameIndex < span.to));
        }

        // ---- Games played offset (GPO) and effective games played (EGP) ----

        /**
         * For each game in history, the share of the players available for it
         * who actually played (e.g. 10 of 14 → about 0.71). This is roughly a
         * present player's chance of playing that game, so it's what a player
         * who missed the game is credited with.
         */
        function getGameShares() {
            return gamesHistory.map((game, i) => {
                const availableCount = players.filter(p => wasAvailableFor(p, i)).length;
                const playedCount = game.team1.length + game.team2.length;
                return availableCount > 0 ? Math.min(playedCount / availableCount, 1) : 1;
            });
        }

        /**
         * Credit for the games a player missed: for every game they weren't
         * available for (before they arrived, or during a break), the share of
         * available players who played it (see getGameShares()). This puts a
         * latecomer, or someone back from a break, roughly where they'd be had
         * they been there and taken normal turns, so arriving late, resting,
         * and leaving and coming back are all treated the same way. Worked out
         * from the history, so deleting a game corrects it automatically.
         */
        function getMissedGamesCredit(player) {
            let credit = 0;
            getGameShares().forEach((share, i) => {
                if (!wasAvailableFor(player, i)) credit += share;
            });
            return credit;
        }

        /**
         * A player's games played offset (GPO): credit for the games they
         * missed (getMissedGamesCredit()) plus any manual -/+ adjustment
         * (offsetAdjustment). Can be negative if the adjustment is: a negative
         * offset gives a player extra priority in team selection. Shown in the
         * GPO column, rounded to one decimal place.
         */
        function getOffset(player) {
            return getMissedGamesCredit(player) + player.offsetAdjustment;
        }

        /**
         * Effective Games Played: a player's raw gamesPlayed plus their games
         * offset (see getOffset()). The fairness basis for team selection, and
         * shown in the "EGP" column. Can be a fraction, and can be negative if
         * the offset is negative.
         */
        function getEffectiveGamesPlayed(player) {
            return roundToHundredths(player.gamesPlayed + getOffset(player));
        }

        // ---- Display helpers -------------------------------------------------

        /**
         * Formats a timestamp (ms since epoch, from Date.now()) into a short
         * display string like "03:45" for the Since column. Returns an empty
         * string if no timestamp is set.
         *
         * Uses the device's own time style, but with any AM/PM marker removed:
         * on a 12-hour device 3:45 PM shows as "03:45", while a 24-hour
         * device shows "15:45". Trimming removes the space that separated
         * the marker from the time.
         */
        function formatTime(timestamp) {
            if (!timestamp) return '';
            return new Intl.DateTimeFormat([], { hour: '2-digit', minute: '2-digit' })
                .formatToParts(new Date(timestamp))
                .filter(part => part.type !== 'dayPeriod')
                .map(part => part.value)
                .join('')
                .trim();
        }

        /**
         * Formats a streak score for the Strk (streak) column: "+2" for games
         * played in a row, "-2" for games sat out in a row, "0" for neither.
         */
        function formatStreak(score) {
            return score > 0 ? `+${score}` : String(score);
        }

        /**
         * Escapes HTML-significant characters in a string before it's interpolated
         * into an innerHTML template. Needed because player names and other
         * user-entered text are set via innerHTML template strings (not textContent,
         * which auto-escapes), so this prevents that content from being interpreted
         * as markup.
         */
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /**
         * Joins names into readable English: "A", "A and B", "A, B, and C".
         * Used for user-facing messages that list players.
         */
        function formatNameList(names) {
            if (names.length <= 1) return names.join('');
            if (names.length === 2) return `${names[0]} and ${names[1]}`;
            return `${names.slice(0, -1).join(', ')}, and ${names[names.length - 1]}`;
        }

        /**
         * Converts a timestamp into minutes since midnight (local time),
         * matching the same hh:mm granularity shown in the Since column via
         * formatTime(). Used for sorting so two times that display the same
         * hh:mm are correctly treated as ties, rather than being ordered by
         * their exact (invisible) millisecond difference. Works from the real
         * 24-hour time, so sorting stays correct even though the display
         * doesn't show AM/PM. Returns null if no timestamp is set.
         */
        function getTimeMinutes(timestamp) {
            if (!timestamp) return null;
            let d = new Date(timestamp);
            return d.getHours() * 60 + d.getMinutes();
        }

        // ---- Player column width -------------------------------------------

        // Extra room added after the longest name, so it isn't flush
        // against the next column.
        const PLAYER_COL_BREATHING_ROOM = 8;

        // Off-screen canvas used only to measure text widths.
        const textMeasureContext = document.createElement('canvas').getContext('2d');

        /**
         * Width in pixels of `text` drawn in the same font as `element`.
         * Measured on a canvas rather than from the element itself, since
         * the element's own width depends on the column width being set.
         */
        function measureTextWidth(text, element) {
            const style = getComputedStyle(element);
            textMeasureContext.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
            return textMeasureContext.measureText(text).width;
        }

        /**
         * Horizontal layout space a checkbox takes: its width plus its left
         * and right margins. Measured from a real checkbox, since browsers
         * draw default checkboxes at slightly different sizes. (The CSS
         * scale(1.2) enlargement is visual only and doesn't add to this.)
         */
        function getCheckboxSpace(checkbox) {
            const style = getComputedStyle(checkbox);
            return checkbox.offsetWidth + parseFloat(style.marginLeft) + parseFloat(style.marginRight);
        }

        /**
         * Sizes the Player column to fit the longest player name (or the
         * "Player" heading, if that's wider), plus PLAYER_COL_BREATHING_ROOM,
         * by setting the --player-col-width variable the column CSS uses.
         * The column never shrinks below this, so full names always show;
         * on narrow screens the other columns scroll sideways instead.
         * Called by renderPlayerList() after each render, so the width
         * follows the roster as players are added.
         */
        function updatePlayerColumnWidth(container) {
            const headerCheckbox = container.querySelector('.header-left-group input[type="checkbox"]');
            const headerLabel = container.querySelector('.header-left-group .sortable-header');
            const nameLabels = container.querySelectorAll('.player-name-label');
            if (!headerCheckbox || !headerLabel) return;

            const checkboxSpace = getCheckboxSpace(headerCheckbox);

            // Header: checkbox + 10px gap + "Player" (with any sort arrow)
            let needed = checkboxSpace + 10 + measureTextWidth(headerLabel.textContent, headerLabel);

            // Rows: checkbox + 8px gap + name. All names share one font, so
            // the font is read from the first label.
            if (nameLabels.length > 0) {
                const widestName = Math.max(...players.map(p => measureTextWidth(p.name, nameLabels[0])));
                needed = Math.max(needed, checkboxSpace + 8 + widestName);
            }

            const width = Math.ceil(needed + PLAYER_COL_BREATHING_ROOM);
            container.style.setProperty('--player-col-width', `${width}px`);
        }

        function setSortColumn(column) {
            if (playerSort.column === column) {
                playerSort.direction = (playerSort.direction === 'asc') ? 'desc' : 'asc';
            } else {
                playerSort.column = column;
                // Sensible default per column: names read naturally A-Z,
                // everything else (times/numbers) reads naturally highest/most-recent-first
                playerSort.direction = (column === 'name') ? 'asc' : 'desc';
            }
            renderPlayerList();
        }

        // For each numeric sort column, the value players are compared by.
        // Players without a value get one lower than any real value, so they
        // sort below everyone who has one: -1 for the Since time (real values
        // are never negative), and -Infinity for Strk (not available), whose
        // real values can be negative. GPO, GP and EGP always have a value.
        const SORT_KEYS = {
            since:          p => p.available ? (getTimeMinutes(p.availableTimestamp) ?? -1) : -1,
            gamesOffset:    p => roundToHundredths(getOffset(p)),
            gamesPlayed:    p => p.gamesPlayed,
            effGamesPlayed: p => getEffectiveGamesPlayed(p),
            streak:         p => p.available ? getStreakScore(p) : -Infinity
        };

        /**
         * Returns player indices in the current display order (see playerSort).
         * The name column sorts by name in the chosen direction. Numeric columns
         * sort by their SORT_KEYS value in the chosen direction, and ties are
         * always broken by name A→Z, whatever the direction.
         *
         * Each player's key is worked out once up front rather than on every
         * comparison, since GPO and EGP go through the whole game history.
         * Keys are compared directly rather than subtracted, since subtracting
         * two -Infinity keys gives NaN, which would break the tie-break.
         */
        function getSortedPlayerIndices() {
            const dir = playerSort.direction === 'asc' ? 1 : -1;
            const getKey = SORT_KEYS[playerSort.column];
            const keys = getKey ? players.map(getKey) : null;

            return players.map((_, idx) => idx).sort((a, b) => {
                const nameCompare = compareNames(players[a].name, players[b].name);
                if (!keys) {
                    return nameCompare * dir;
                }
                if (keys[a] !== keys[b]) {
                    return (keys[a] < keys[b] ? -1 : 1) * dir;
                }
                return nameCompare;
            });
        }

        /**
         * Returns the HTML for a clickable, sortable column header label,
         * including the ▲/▼ arrow when this column is the active sort column.
         */
        function sortableHeaderHTML(text, columnKey) {
            let arrow = '';
            if (playerSort.column === columnKey) {
                arrow = playerSort.direction === 'asc' ? ' \u25B2' : ' \u25BC';
            }
            return `<span class="sortable-header" onclick="setSortColumn('${columnKey}')">${escapeHtml(text)}${arrow}</span>`;
        }

        /**
         * Shows/hides the "Today" badge next to the roster dropdown, based on
         * whether the currently selected roster matches today's day-of-week
         * default (see getDefaultRosterKeyForToday()). Called whenever the
         * selected roster changes, so the badge only ever appears next to the
         * roster that was actually auto-selected for today.
         */
        function updateTodayBadge() {
            const badge = document.getElementById('todayBadge');
            const selectedRoster = document.getElementById('rosterSelect').value;
            const todayRosterKey = getDefaultRosterKeyForToday();
            badge.style.display = (todayRosterKey && selectedRoster === todayRosterKey) ? 'inline' : 'none';
        }

        /**
         * Starts a fresh session with the roster currently chosen in the
         * dropdown. Used both when the user picks a roster and on app startup,
         * so the two always behave identically.
         */
        function onRosterSelected() {
            updateTodayBadge();
            resetTracker();
        }

        function showAlert(message) {
            const alertBox = document.getElementById('customAlert');
            const alertMsg = document.getElementById('customAlertMsg');
            alertMsg.textContent = message;
            alertBox.style.display = 'flex';
        }

        function hideAlert() {
            document.getElementById('customAlert').style.display = 'none';
        }

        function updatePlayerCounts() {
            let total = players.length;
            let availableCount = players.filter(p => p.available).length;
            document.getElementById('playerCountDisplay').innerHTML = `<b>Available players:</b> ${availableCount} / ${total}`;
        }

        /**
         * Header checkbox in the Player column. Checking it marks everyone
         * available; unchecking it marks everyone unavailable.
         */
        function toggleSelectAll(isChecked) {
            players.forEach(isChecked ? markAvailable : markUnavailable);
            renderPlayerList();
        }

        /**
         * Renders the player list: a sortable header row plus one row per
         * player, all inside a single scroll container (.player-rows) so the
         * header scrolls sideways together with the rows. Builds the whole
         * thing as an HTML string via template literals and sets it in a
         * single innerHTML assignment, rather than constructing each
         * element/attribute individually with document.createElement — same
         * visual result, far less code.
         */
        function renderPlayerList() {
            const container = document.getElementById('playerContainer');

            // Preserve the current scroll position (both directions) before rebuilding
            const existingRows = container.querySelector('.player-rows');
            const previousScrollTop = existingRows ? existingRows.scrollTop : 0;
            const previousScrollLeft = existingRows ? existingRows.scrollLeft : 0;

            let totalCount = players.length;
            let availableCount = players.filter(p => p.available).length;

            let sortedIndices = getSortedPlayerIndices();

            let rowsHtml = sortedIndices.map((index) => {
                let p = players[index];
                let nameClass = p.available ? 'player-name-label' : 'player-name-label unavailable';
                let sinceHtml = (p.available && p.availableTimestamp)
                    ? `<span class="since-time">${escapeHtml(formatTime(p.availableTimestamp))}</span>`
                    : '';
                let offsetText = formatNumber(roundToHundredths(getOffset(p)));
                // The streak only matters for selection while the player is
                // available, so it's only shown then
                let streakText = p.available ? formatStreak(getStreakScore(p)) : '-';

                return `
                    <div class="player-item">
                        <div class="player-left-group">
                            <div class="player-info">
                                <input type="checkbox" id="available_${index}" ${p.available ? 'checked' : ''}
                                    onchange="toggleAvailable(${index}, this.checked)">
                                <label for="available_${index}" class="${nameClass}" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</label>
                            </div>
                        </div>
                        <div class="player-center-group">
                            ${sinceHtml}
                        </div>
                        <div class="player-offset-group">
                            <div class="counter-controls">
                                <button class="counter-btn" onclick="adjustOffset(${index}, -1)">-</button>
                                <span class="stats-badge">${offsetText}</span>
                                <button class="counter-btn" onclick="adjustOffset(${index}, 1)">+</button>
                            </div>
                        </div>
                        <div class="player-right-group">
                            <span class="stats-badge">${p.gamesPlayed}</span>
                        </div>
                        <div class="player-eff-group">
                            <span class="stats-badge">${formatNumber(getEffectiveGamesPlayed(p))}</span>
                        </div>
                        <div class="player-streak-group">
                            <span class="stats-badge">${streakText}</span>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="player-rows">
                    <div class="list-header">
                        <div class="header-left-group">
                            <input type="checkbox" id="selectAllCheckbox" ${(totalCount > 0 && availableCount === totalCount) ? 'checked' : ''}
                                onchange="toggleSelectAll(this.checked)">
                            ${sortableHeaderHTML("Player", 'name')}
                        </div>
                        <div class="header-center-group">
                            ${sortableHeaderHTML("Since", 'since')}
                        </div>
                        <div class="header-offset-group">
                            ${sortableHeaderHTML("GPO", 'gamesOffset')}
                        </div>
                        <div class="header-right-group">
                            ${sortableHeaderHTML("GP", 'gamesPlayed')}
                        </div>
                        <div class="header-eff-group">
                            ${sortableHeaderHTML("EGP", 'effGamesPlayed')}
                        </div>
                        <div class="header-streak-group">
                            ${sortableHeaderHTML("Strk", 'streak')}
                        </div>
                    </div>
                    ${rowsHtml}
                </div>
            `;

            // "indeterminate" can't be expressed via an HTML attribute, so it's
            // set imperatively here right after the markup is inserted.
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (selectAllCheckbox) {
                selectAllCheckbox.indeterminate = availableCount > 0 && availableCount < totalCount;
            }

            // Size the Player column to the longest name now that it's rendered
            updatePlayerColumnWidth(container);

            // Restore the scroll position after rebuilding the list. Done
            // after sizing the Player column, since that sets how far the
            // list can scroll sideways.
            const rowsContainer = container.querySelector('.player-rows');
            if (rowsContainer) {
                rowsContainer.scrollTop = previousScrollTop;
                rowsContainer.scrollLeft = previousScrollLeft;
            }

            updatePlayerCounts();
        }

        function addPlayer() {
            const input = document.getElementById('newPlayerName');
            const name = input.value.trim();
            if (name === "") {
                return;
            }
            if (name.length > 16) {
                showAlert("Player name must be 16 characters or fewer.");
                return;
            }
            // "name" is trimmed above and every player's name is trimmed in
            // createPlayer(), so stray whitespace can't fool this check.
            const isDuplicate = players.some(p => compareNames(p.name, name) === 0);
            if (isDuplicate) {
                showAlert(`"${name}" is already on this roster.`);
                return;
            }
            players.push(createPlayer(name));
            players.sort((a, b) => compareNames(a.name, b.name));
            input.value = '';
            hideAlert();
            renderPlayerList();
        }

        /**
         * Checkbox beside a player's name: marks them available (here and
         * ready to play) or unavailable (resting or gone; the app treats both
         * the same way).
         */
        function toggleAvailable(index, isAvailable) {
            const player = players[index];
            if (isAvailable) {
                markAvailable(player);
            } else {
                markUnavailable(player);
            }
            renderPlayerList();
        }

        /**
         * -/+ buttons in the GPO column. Moves the player's manual
         * offsetAdjustment, and so their offset (getOffset()), by `amount`.
         * The offset may go negative, which gives the player extra priority in
         * team selection. Works whether or not the player is available, and
         * the adjustment is kept through breaks until Reset.
         */
        function adjustOffset(index, amount) {
            players[index].offsetAdjustment += amount;
            renderPlayerList();
        }

        /**
         * Starts a fresh session for the currently selected roster: rebuilds
         * its players from the roster's name list and clears all availability,
         * games played, adjustments, and history. Runs when the user clicks
         * Reset, and whenever a roster is selected (from the dropdown or on
         * app startup — see onRosterSelected()).
         */
        function resetTracker() {
            const currentRoster = document.getElementById('rosterSelect').value;

            players = getRosterNames(currentRoster).map(name => createPlayer(name));
            pendingTeam1Names = [];
            pendingTeam2Names = [];
            gamesHistory = [];
            document.getElementById('playersPerTeamInput').value = 5;
            document.getElementById('newPlayerName').value = '';
            document.getElementById('outputCard').style.display = 'none';
            hideAlert();
            renderPlayerList();
            renderHistory();

            // A fresh session starts scrolled to the top-left
            const rowsContainer = document.querySelector('#playerContainer .player-rows');
            if (rowsContainer) {
                rowsContainer.scrollTop = 0;
                rowsContainer.scrollLeft = 0;
            }
        }

        /**
         * Shuffles an array in place using the Fisher–Yates algorithm and
         * returns it. Every possible ordering is exactly equally likely.
         *
         * Used instead of the common sort(() => Math.random() - 0.5) trick,
         * which is biased: sort() assumes a consistent comparator, so random
         * answers make elements tend to stay near their starting positions
         * (and the exact bias varies by browser). Since the arrays shuffled
         * here start in alphabetical or priority order, that bias would leak
         * into who wins tie-breaks and who ends up on which team.
         */
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // ---- Teammate-repeat avoidance --------------------------------------

        // A new team may not contain this many (or more) players who were all on
        // the same team together in an earlier game this session.
        const REPEAT_GROUP_SIZE = 3;

        // Maximum random splits to try before settling for the least-overlap one.
        const SPLIT_ATTEMPTS = 2000;

        /**
         * Returns every team from this session's games as a Set of player
         * names, for fast membership checks.
         */
        function getPastTeams() {
            const teams = [];
            gamesHistory.forEach(game => {
                teams.push(new Set(game.team1));
                teams.push(new Set(game.team2));
            });
            return teams;
        }

        /**
         * Scores how badly a proposed team repeats past teammate groups.
         * For each past team, counts how many of this team's players were on
         * it; any overlap at or above REPEAT_GROUP_SIZE adds to the penalty
         * (larger overlaps cost more). 0 means no rule violations.
         */
        function getRepeatPenalty(teamNames, pastTeams) {
            let penalty = 0;
            pastTeams.forEach(pastTeam => {
                let overlap = 0;
                teamNames.forEach(name => {
                    if (pastTeam.has(name)) overlap++;
                });
                if (overlap >= REPEAT_GROUP_SIZE) {
                    penalty += overlap - (REPEAT_GROUP_SIZE - 1);
                }
            });
            return penalty;
        }

        /**
         * Splits the chosen players into two teams of `perTeam`, avoiding any
         * team that repeats a teammate group of REPEAT_GROUP_SIZE or more from
         * an earlier game this session.
         *
         * Tries uniformly random splits and returns the first one with no
         * violations — so every valid split is equally likely. If none is
         * found within SPLIT_ATTEMPTS, returns the split with the lowest
         * penalty. Returns { team1, team2, penalty }.
         */
        function findBestSplit(names, perTeam) {
            const pastTeams = getPastTeams();
            const work = [...names];
            let best = null;

            for (let attempt = 0; attempt < SPLIT_ATTEMPTS; attempt++) {
                shuffle(work);
                const team1 = work.slice(0, perTeam);
                const team2 = work.slice(perTeam, perTeam * 2);
                const penalty = getRepeatPenalty(team1, pastTeams) + getRepeatPenalty(team2, pastTeams);

                if (best === null || penalty < best.penalty) {
                    best = { team1: [...team1], team2: [...team2], penalty: penalty };
                    if (penalty === 0) break;
                }
            }

            return best;
        }

        // ---- Team selection ------------------------------------------------

        /**
         * Streak score for a player, shown in the Strk column and used first
         * in team selection. Worked out from scratch by going through every
         * game in order, so it's always consistent with the history, even
         * after a game is deleted:
         * - A game they were available for and played: extends a playing
         *   streak, or starts one at +1.
         * - A game they were available for and sat out: extends a sit-out
         *   streak, or starts one at -1.
         * - A game they were away for (before arriving, or during a break):
         *   a sit-out streak moves one step toward 0, and a playing streak
         *   drops to 0. So waiting done while present still counts after a
         *   short break, but skipping a turn costs some of it.
         * - NEGATIVE = consecutive games SAT OUT (e.g., -2 = sat out 2 straight games).
         * - POSITIVE = consecutive games PLAYED (e.g., +2 = played 2 straight games).
         * - 0 = neither (new arrival, or back from a long enough break).
         */
        function getStreakScore(player) {
            let streak = 0;
            gamesHistory.forEach((game, i) => {
                if (!wasAvailableFor(player, i)) {
                    streak = streak < 0 ? streak + 1 : 0;
                } else if (playedIn(game, player.name)) {
                    streak = streak > 0 ? streak + 1 : 1;
                } else {
                    streak = streak < 0 ? streak - 1 : -1;
                }
            });
            return streak;
        }

        /**
         * Decides WHO plays next: returns the names of the `count` highest-priority
         * available players. All the fairness rules for selection live here:
         * 1. Streak tier first: longest sit-out streak (most negative score) wins.
         * 2. Within a tier, fewest effective games played (gamesPlayed + offset).
         * 3. Exact ties are broken randomly: each tier is shuffled before the
         *    stable sort, so tied players keep that random order.
         * Each player's EGP is worked out once up front rather than on every
         * comparison, since it goes through the whole game history.
         * Callers must ensure at least `count` players are available.
         */
        function selectPlayers(count) {
            const available = players.filter(p => p.available);
            const egp = new Map(available.map(p => [p, getEffectiveGamesPlayed(p)]));

            const tiers = {};
            available.forEach(p => {
                const score = getStreakScore(p);
                if (!tiers[score]) tiers[score] = [];
                tiers[score].push(p);
            });

            const prioritized = Object.keys(tiers)
                .map(Number)
                .sort((a, b) => a - b)
                .flatMap(score => shuffle(tiers[score])
                    .sort((a, b) => egp.get(a) - egp.get(b)));

            return prioritized.slice(0, count).map(p => p.name);
        }

        /**
         * Shows the pending teams in the preview card and re-enables Accept,
         * resetting its label (acceptLineup() changes it to "Teams Accepted ✓").
         */
        function renderTeamsPreview() {
            const toListHtml = names => names.map(name => `<li>${escapeHtml(name)}</li>`).join('');
            document.getElementById('team1List').innerHTML = toListHtml(pendingTeam1Names);
            document.getElementById('team2List').innerHTML = toListHtml(pendingTeam2Names);

            const acceptBtn = document.getElementById('acceptBtn');
            acceptBtn.disabled = false;
            acceptBtn.textContent = "Accept Teams & Update Games Played";

            document.getElementById('outputCard').style.display = 'block';
        }

        /**
         * Generate button handler: validates input, picks who plays
         * (selectPlayers()), splits them into teams (findBestSplit()), and shows
         * the preview.
         */
        function generateTeams() {
            hideAlert();

            const perTeam = parseInt(document.getElementById('playersPerTeamInput').value);
            if (isNaN(perTeam) || perTeam < 1) {
                showAlert("Please enter a valid number of players per team!");
                return;
            }

            const requiredTotal = perTeam * 2;
            if (players.filter(p => p.available).length < requiredTotal) {
                showAlert(`Please select at least ${requiredTotal} available players to form two ${perTeam}-player teams!`);
                return;
            }

            // Names, not indices, are stored — indices go stale if the players
            // array is re-sorted before Accept/Copy.
            const split = findBestSplit(selectPlayers(requiredTotal), perTeam);
            pendingTeam1Names = split.team1.sort(compareNames);  // alphabetical for display
            pendingTeam2Names = split.team2.sort(compareNames);

            renderTeamsPreview();

            if (split.penalty > 0) {
                showAlert(`Could not avoid repeating a group of ${REPEAT_GROUP_SIZE}+ teammates from previous games, so the split with the least overlap was used.`);
            }
        }

        function copyTeamsToClipboard() {
            if (pendingTeam1Names.length === 0 && pendingTeam2Names.length === 0) {
                showAlert("Generate teams first before copying.");
                return;
            }

            let lines = [];
            lines.push("Team 1:");
            pendingTeam1Names.forEach((name, idx) => {
                lines.push(`${idx + 1}. ${name}`);
            });
            lines.push("");
            lines.push("Team 2:");
            pendingTeam2Names.forEach((name, idx) => {
                lines.push(`${idx + 1}. ${name}`);
            });

            let teamsText = lines.join("\n");

            const copyBtn = document.getElementById('copyTeamsBtn');
            const originalText = copyBtn ? copyBtn.textContent : null;

            function showCopiedFeedback() {
                if (copyBtn) {
                    copyBtn.textContent = "Copied!";
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                    }, 1500);
                }
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(teamsText).then(showCopiedFeedback).catch(() => {
                    fallbackCopyText(teamsText, showCopiedFeedback);
                });
            } else {
                fallbackCopyText(teamsText, showCopiedFeedback);
            }
        }

        function fallbackCopyText(text, onSuccess) {
            let textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                if (onSuccess) onSuccess();
            } catch (e) {
                showAlert("Unable to copy teams. Please copy manually.");
            }
            document.body.removeChild(textarea);
        }

        function acceptLineup() {
            const previewNames = [...pendingTeam1Names, ...pendingTeam2Names];

            // Refuse to record a lineup that's gone stale: if anyone in the
            // preview has been marked unavailable (or no longer exists) since
            // Generate, the preview no longer reflects who's actually playing.
            // Recording it anyway would put players in history who weren't
            // available for that game, corrupting streaks and credits.
            const unavailableNames = previewNames.filter(name => {
                const player = players.find(p => p.name === name);
                return !player || !player.available;
            });
            if (unavailableNames.length > 0) {
                const verb = unavailableNames.length === 1 ? 'is' : 'are';
                showAlert(`${formatNameList(unavailableNames)} ${verb} no longer available. Generate again to update teams.`);
                return;
            }

            // Everyone in the lineup is confirmed available, so every name
            // recorded in history below is also credited here — the two
            // always stay in sync.
            const selectedNames = new Set(previewNames);
            players.forEach(p => {
                if (selectedNames.has(p.name)) {
                    p.gamesPlayed++;
                }
            });

            // Add to games history. `timestamp` is a display string only, and
            // history is never sorted by time — see getSortedHistoryIndices()
            // for why. Recorded before the player list is re-rendered, so
            // the Strk, GPO and EGP columns include this game.
            gamesHistory.push({
                team1: [...pendingTeam1Names],
                team2: [...pendingTeam2Names],
                timestamp: new Date().toLocaleString()
            });

            hideAlert();
            renderPlayerList();
            renderHistory();

            // Confirm the accept; renderTeamsPreview() restores the label on
            // the next Generate.
            const acceptBtn = document.getElementById('acceptBtn');
            acceptBtn.disabled = true;
            acceptBtn.textContent = "Teams Accepted ✓";
        }

        function deleteGame(historyIndex) {
            let game = gamesHistory[historyIndex];

            // Decrement games played count for players who were in this game entry
            let allPlayerNames = [...game.team1, ...game.team2];
            allPlayerNames.forEach(name => {
                let player = players.find(p => p.name === name);
                if (player && player.gamesPlayed > 0) {
                    player.gamesPlayed--;
                }
            });

            // Remove game entry from history
            gamesHistory.splice(historyIndex, 1);

            // Keep each stretch of availability pointing at the same games. A
            // deleted game before a position shifts it down by one; a game
            // after it doesn't affect it. A deleted game inside a stretch
            // shortens it, and one in the gap between two stretches shortens
            // the break. Streaks and credits are worked out from these and the
            // history, so they're corrected automatically.
            players.forEach(p => {
                p.availability.forEach(span => {
                    if (historyIndex < span.from) span.from--;
                    if (span.to !== null && historyIndex < span.to) span.to--;
                });
            });

            // Any open preview was generated from the old history (streaks and
            // games played), so it no longer reflects who should be playing.
            // Clear it so Accept can't record a stale lineup. Only notify the
            // user if the preview was still pending — an already-accepted
            // preview has nothing left to lose.
            const outputCard = document.getElementById('outputCard');
            const acceptBtn = document.getElementById('acceptBtn');
            const previewWasPending = outputCard.style.display !== 'none' && !acceptBtn.disabled;
            pendingTeam1Names = [];
            pendingTeam2Names = [];
            outputCard.style.display = 'none';

            renderPlayerList();
            renderHistory();

            if (previewWasPending) {
                showAlert("Teams preview cleared because game history changed. Generate again for updated teams.");
            }
        }

        /**
         * Returns gamesHistory indices in newest-first order. Games are always
         * appended via push() in acceptLineup(), so array position already IS
         * the true chronological order — reversing it is sufficient.
         *
         * This intentionally does NOT sort by any wall-clock timestamp
         * (e.g. Date.now()). System clocks are not guaranteed to move only
         * forward — NTP sync, DST transitions, or a manual/automatic clock
         * adjustment can make it jump backward — which would give a later
         * game a smaller timestamp than an earlier one and put them in the
         * wrong order. Array position has no such failure mode.
         */
        function getSortedHistoryIndices() {
            return gamesHistory.map((_, idx) => idx).reverse();
        }

        /**
         * Renders the Games Played History card: one entry per game, newest
         * first. Builds the whole thing as an HTML string via template
         * literals and sets it in a single innerHTML assignment, rather than
         * constructing each element with document.createElement.
         */
        function renderHistory() {
            const historyContainer = document.getElementById('historyContainer');
            const historyCard = document.getElementById('historyCard');

            if (gamesHistory.length === 0) {
                historyContainer.innerHTML = '';
                historyCard.style.display = 'none';
                return;
            }

            historyCard.style.display = 'block';

            historyContainer.innerHTML = getSortedHistoryIndices().map((index) => {
                let game = gamesHistory[index];
                let team1Html = game.team1.map(name => `<li>${escapeHtml(name)}</li>`).join('');
                let team2Html = game.team2.map(name => `<li>${escapeHtml(name)}</li>`).join('');

                return `
                    <div class="history-item">
                        <div class="history-item-header">
                            <h4>Game ${index + 1}</h4>
                            <div class="history-item-actions">
                                <span class="history-timestamp">${escapeHtml(game.timestamp)}</span>
                                <button class="delete-btn" onclick="deleteGame(${index})">Delete</button>
                            </div>
                        </div>
                        <div class="teams-container">
                            <div class="team">
                                <h3>Team 1</h3>
                                <ol>${team1Html}</ol>
                            </div>
                            <div class="team">
                                <h3>Team 2</h3>
                                <ol>${team2Html}</ol>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Initialize on page load: clear any state older versions saved, build
        // the roster dropdown, then start fresh with today's roster, or the
        // empty Custom roster on days without one. onRosterSelected() does
        // exactly what happens when a roster is picked from the dropdown.
        clearLegacySavedState();
        renderRosterOptions();
        document.getElementById('rosterSelect').value = getDefaultRosterKeyForToday() || 'empty';
        onRosterSelected();
    </script>

    <script>
        /**
         * Asks the active service worker for its CACHE_NAME and shows it at the
         * bottom of the page. Uses a MessageChannel so the reply comes back on
         * a private port, not as a general message event.
         */
        function showAppVersion() {
            navigator.serviceWorker.ready.then((registration) => {
                if (!registration.active) return;
                const channel = new MessageChannel();
                channel.port1.onmessage = (event) => {
                    document.getElementById('appVersion').textContent = event.data;
                };
                registration.active.postMessage({ type: 'GET_VERSION' }, [channel.port2]);
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
                showAppVersion();
            });

            // When a newly deployed service worker takes over (via skipWaiting()
            // and clients.claim() in sw.js), refresh the displayed version.
            navigator.serviceWorker.addEventListener('controllerchange', showAppVersion);
        }
    </script>
</body>
</html>
